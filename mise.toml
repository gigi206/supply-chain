# Outils des bancs et des briques du PoC, épinglés aux versions des mesures faites
# dans le cloud (journaux des dossiers resultats/). Rien n'est installé au niveau
# système : `mise install`, puis `mise run outils`.
#
# mise vérifie les sommes de contrôle et, quand le registre aqua les déclare, les
# signatures (cosign, SLSA, attestations GitHub) ; mise.lock fige versions, URL et
# sommes. Les tâches `outils:*` couvrent ce qu'aucun backend ne fournit.

[settings]
lockfile_platforms = ["linux-x64"]   # amd64 uniquement (docs/01)

[tools]
go = "1.24.7"                                   # banc B ; Go 1.26.10 : tâche outils:go-toolchain
python = "3.13.12"                              # venv de Hermeto
node = "22.22.0"                                # interface de sample-app (banc B, brique 03)
"aqua:moby/buildkit" = "0.25.2"                 # brique 04 : release amont (mesure en plus) ;
"aqua:opencontainers/runc" = "1.3.3"            # la référence est celle du nixpkgs (tâche outils:nix)
"aqua:rootless-containers/rootlesskit" = "2.3.5" # BuildKit sans root
"aqua:project-zot/zot" = "2.1.22"               # registre local (localhost:5000)
"aqua:oras-project/oras" = "1.3.6"
"aqua:google/go-containerregistry" = "0.20.6"   # crane
"aqua:sigstore/cosign" = "3.1.4"
"aqua:kyverno/kyverno" = "1.19.2"
"aqua:anchore/syft" = "1.38.0"
"aqua:anchore/grype" = "0.104.1"
"github:conforma/cli" = { version = "0.10.42", asset_pattern = "ec_linux_amd64", bin = "ec" }
"aqua:kubernetes-sigs/kind" = "0.33.0"          # banc A1 (Konflux)
"aqua:kubernetes/kubernetes/kubectl" = "1.37.2" # nœud kind v1.37.0
"forgejo:forgejo/forgejo" = "15.0.11"           # banc A1 : forge de test (LTS)

[env]
# Chemins lus par les bench.sh ; WORKDIR et les données restent sur disque, pas dans /tmp (tmpfs).
POC_OUTILS = "{{env.HOME}}/.cache/supply-chain-poc/outils"
HERMETO = "{{env.HOME}}/.cache/supply-chain-poc/outils/hermeto/bin/hermeto"
GOROOT_DIR = "{{env.HOME}}/.cache/supply-chain-poc/outils/gomodcache/golang.org/toolchain@v0.0.1-go1.26.10.linux-amd64"
BUSYBOX = "{{env.HOME}}/.cache/supply-chain-poc/outils/busybox/bin/busybox"
SPDX = "{{env.HOME}}/.cache/supply-chain-poc/outils/spdx-json/json"   # nix suffixe le lien du nom de la sortie
_.path = ["{{env.HOME}}/.cache/supply-chain-poc/outils/reuse/bin"]

[tasks.outils]
description = "Outils hors backends mise"
depends = ["outils:hermeto", "outils:go-toolchain", "outils:nix"]

[tasks."outils:hermeto"]
description = "Hermeto 0.64.0 (absent de PyPI) : tag source vérifié, dépendances installées par hash"
run = '''
set -eu
v="$POC_OUTILS/hermeto"
src=$(mktemp -d)
git -c advice.detachedHead=false clone -q --depth 1 --branch 0.64.0 https://github.com/hermetoproject/hermeto.git "$src/hermeto"
test "$(git -C "$src/hermeto" rev-parse HEAD)" = 1f37e32dfdf28342b50c6f394c3e99914fdb24e9
rm -rf "$v"
python -m venv "$v"
"$v/bin/pip" install -q --require-hashes --no-deps -r "$src/hermeto/requirements-build.txt"
"$v/bin/pip" install -q --require-hashes --no-deps -r "$src/hermeto/requirements.txt"
"$v/bin/pip" install -q --no-deps --no-build-isolation "$src/hermeto"
rm -rf "$src"
"$HERMETO" --version
'''

[tasks."outils:go-toolchain"]
description = "Go 1.26.10 comme module golang.org/toolchain, vérifié par sum.golang.org (comme dans le cloud)"
run = '''
set -eu
GOMODCACHE="$POC_OUTILS/gomodcache" GOTOOLCHAIN=go1.26.10 GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go version
"$GOROOT_DIR/bin/go" version
'''

[tasks."outils:nix"]
description = "busybox statique, liste SPDX, reuse, BuildKit et runc du nixpkgs épinglé du banc B (mêmes binaires que dans le cloud) ; cosign de vérification"
run = '''
set -eu
for p in pkgsStatic.busybox:busybox spdx-license-list-data.json:spdx reuse:reuse cosign:cosign-nix buildkit:buildkit-nix runc:runc-nix; do
  nix build --inputs-from ./poc/benchmarks/nix "nixpkgs#${p%%:*}" --out-link "$POC_OUTILS/${p##*:}"
done
"$BUSYBOX" | head -1
ls "$SPDX/licenses.json" "$SPDX/exceptions.json"
"$POC_OUTILS/reuse/bin/reuse" --version
'''

[tasks."outils:verifier"]
description = "Empreintes et signatures de tous les outils (cosign du nixpkgs épinglé, GPG en trousseau temporaire)"
depends = ["outils"]
run = "poc/infra/verifier-outils.sh | sed \"s#$HOME#~#g\" | tee poc/infra/resultats/outils.txt"

[tasks."konflux:preparer"]
description = "Banc A1 : copie de Konflux v0.2.2, entrées vérifiées et épinglées, adaptations au laptop commitées"
run = "poc/benchmarks/konflux/preparer.sh"

[tasks."konflux:deployer"]
description = "Banc A1 : cluster kind (20 Gi, ports sur 127.0.0.1) et Konflux v0.2.2 depuis la copie préparée ; chronomètre"
run = "poc/benchmarks/konflux/deployer.sh"

[tasks."konflux:etat"]
description = "Banc A1 : archive pods, images, composants et mémoire (resultats/etat-<libellé>/)"
run = "poc/benchmarks/konflux/etat.sh"

[tasks."konflux:forgejo"]
description = "Banc A1 : Forgejo 15.0.11 sur la passerelle du réseau kind (arguments : stop)"
run = "poc/benchmarks/konflux/forgejo.sh"

[tasks."konflux:onboarder"]
description = "Banc A1 : dépôt Forgejo sample-app, identifiants SCM, Application et Component (configure-pac)"
run = "poc/benchmarks/konflux/onboarder.sh"

[tasks."konflux:parametrer"]
description = "Banc A1 : build hermétique, prefetch gomod + npm et SOURCE_DATE_EPOCH dans la PR de configuration"
run = "poc/benchmarks/konflux/parametrer.sh"

[tasks."konflux:demonter"]
description = "Banc A1 : supprime le cluster kind et son KUBECONFIG dédié"
run = '''
KUBECONFIG="$HOME/.kube/supply-chain-poc-konflux.yaml" kind delete cluster --name konflux
rm -f "$HOME/.kube/supply-chain-poc-konflux.yaml"
'''

[tasks.bancs]
description = "Rejoue les bancs locaux de l'étape 4b (Zot et BuildKit rootless éphémères) ; journaux */resultats/*-laptop.*"
depends = ["outils"]
run = "poc/infra/bancs-laptop.sh"
