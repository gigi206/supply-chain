# Outils des bancs et des briques du PoC, épinglés aux versions des mesures faites
# dans le cloud (journaux des dossiers resultats/). Rien n'est installé au niveau
# système : `mise install`, puis `mise run outils`.
#
# mise vérifie les sommes de contrôle et, quand le registre aqua les déclare, les
# signatures (cosign, SLSA, attestations GitHub) ; mise.lock fige versions, URL et
# sommes. Les tâches `outils:*` couvrent ce qu'aucun backend ne fournit.

[settings]
lockfile_platforms = ["linux-x64"]   # amd64 uniquement (docs/01)

[tools]
go = "1.24.7"                                   # banc B ; Go 1.26.10 : tâche outils:go-toolchain
python = "3.13.12"                              # venv de Hermeto
node = "22.22.0"                                # interface de sample-app (banc B, brique 03)
"aqua:moby/buildkit" = "0.25.2"                 # brique 04 : release amont (mesure en plus) ;
"aqua:opencontainers/runc" = "1.3.3"            # la référence est celle du nixpkgs (tâche outils:nix)
"aqua:rootless-containers/rootlesskit" = "2.3.5" # BuildKit sans root
"aqua:project-zot/zot" = "2.1.22"               # registre local (localhost:5000)
"aqua:oras-project/oras" = "1.3.6"
"aqua:google/go-containerregistry" = "0.20.6"   # crane
"aqua:sigstore/cosign" = "3.1.4"
"aqua:kyverno/kyverno" = "1.19.2"
"aqua:tektoncd/cli" = "0.46.2"                   # tkn : brique 08, J6 (Trusted Resources, bundles Tekton) ; sha256 seulement (accord du propriétaire)
"aqua:anchore/syft" = "1.38.0"
"aqua:anchore/grype" = "0.104.1"
"github:conforma/cli" = { version = "0.10.42", asset_pattern = "ec_linux_amd64", bin = "ec" }
"aqua:kubernetes-sigs/kind" = "0.33.0"          # banc A1 (Konflux)
"aqua:kubernetes/kubernetes/kubectl" = "1.35.10" # brique 08 : k3s v1.35.9 (écart de version toléré : ±1) ; banc A1 (kind v1.37.0) mesuré en 1.37.2
"forgejo:forgejo/forgejo" = "15.0.11"           # banc A1 : forge de test (LTS)

[env]
# Chemins lus par les bench.sh ; WORKDIR et les données restent sur disque, pas dans /tmp (tmpfs).
POC_OUTILS = "{{env.HOME}}/.cache/supply-chain-poc/outils"
HERMETO = "{{env.HOME}}/.cache/supply-chain-poc/outils/hermeto/bin/hermeto"
GOROOT_DIR = "{{env.HOME}}/.cache/supply-chain-poc/outils/gomodcache/golang.org/toolchain@v0.0.1-go1.26.10.linux-amd64"
BUSYBOX = "{{env.HOME}}/.cache/supply-chain-poc/outils/busybox/bin/busybox"
SPDX = "{{env.HOME}}/.cache/supply-chain-poc/outils/spdx-json/json"   # nix suffixe le lien du nom de la sortie
_.path = ["{{env.HOME}}/.cache/supply-chain-poc/outils/reuse/bin"]

[tasks.outils]
description = "Outils hors backends mise"
depends = ["outils:hermeto", "outils:go-toolchain", "outils:nix"]

[tasks."outils:hermeto"]
description = "Hermeto 0.64.0 (absent de PyPI) : tag source vérifié, dépendances installées par hash"
run = '''
set -eu
v="$POC_OUTILS/hermeto"
src=$(mktemp -d)
git -c advice.detachedHead=false clone -q --depth 1 --branch 0.64.0 https://github.com/hermetoproject/hermeto.git "$src/hermeto"
test "$(git -C "$src/hermeto" rev-parse HEAD)" = 1f37e32dfdf28342b50c6f394c3e99914fdb24e9
rm -rf "$v"
python -m venv "$v"
"$v/bin/pip" install -q --require-hashes --no-deps -r "$src/hermeto/requirements-build.txt"
"$v/bin/pip" install -q --require-hashes --no-deps -r "$src/hermeto/requirements.txt"
"$v/bin/pip" install -q --no-deps --no-build-isolation "$src/hermeto"
rm -rf "$src"
"$HERMETO" --version
'''

[tasks."outils:go-toolchain"]
description = "Go 1.26.10 comme module golang.org/toolchain, vérifié par sum.golang.org (comme dans le cloud)"
run = '''
set -eu
GOMODCACHE="$POC_OUTILS/gomodcache" GOTOOLCHAIN=go1.26.10 GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go version
"$GOROOT_DIR/bin/go" version
'''

[tasks."outils:nix"]
description = "busybox statique, liste SPDX, reuse, BuildKit et runc du nixpkgs épinglé du banc B (mêmes binaires que dans le cloud) ; cosign de vérification"
run = '''
set -eu
for p in pkgsStatic.busybox:busybox spdx-license-list-data.json:spdx reuse:reuse cosign:cosign-nix buildkit:buildkit-nix runc:runc-nix; do
  nix build --inputs-from ./poc/benchmarks/nix "nixpkgs#${p%%:*}" --out-link "$POC_OUTILS/${p##*:}"
done
"$BUSYBOX" | head -1
ls "$SPDX/licenses.json" "$SPDX/exceptions.json"
"$POC_OUTILS/reuse/bin/reuse" --version
'''

[tasks."outils:verifier"]
description = "Empreintes et signatures de tous les outils (cosign du nixpkgs épinglé, GPG en trousseau temporaire)"
depends = ["outils"]
run = "poc/infra/verifier-outils.sh | sed \"s#$HOME#~#g\" | tee poc/infra/resultats/outils.txt"

[tasks."konflux:preparer"]
description = "Banc A1 : copie de Konflux v0.2.2, entrées vérifiées et épinglées, adaptations au laptop commitées"
run = "poc/benchmarks/konflux/preparer.sh"

[tasks."konflux:deployer"]
description = "Banc A1 : cluster kind (20 Gi, ports sur 127.0.0.1) et Konflux v0.2.2 depuis la copie préparée ; chronomètre"
run = "poc/benchmarks/konflux/deployer.sh"

[tasks."konflux:etat"]
description = "Banc A1 : archive pods, images, composants et mémoire (resultats/etat-<libellé>/)"
run = "poc/benchmarks/konflux/etat.sh"

[tasks."konflux:forgejo"]
description = "Banc A1 : Forgejo 15.0.11 sur la passerelle du réseau kind (arguments : stop)"
run = "poc/benchmarks/konflux/forgejo.sh"

[tasks."konflux:onboarder"]
description = "Banc A1 : dépôt Forgejo sample-app, identifiants SCM, Application et Component (configure-pac)"
run = "poc/benchmarks/konflux/onboarder.sh"

[tasks."konflux:parametrer"]
description = "Banc A1 : build hermétique, prefetch gomod + npm et SOURCE_DATE_EPOCH dans la PR de configuration"
run = "poc/benchmarks/konflux/parametrer.sh"

[tasks."konflux:tests-negatifs"]
description = "Banc A1 : tests négatifs T1 à T6 et T8 (PR hostile, RBAC, webhooks non signé et rejoué, horodatage)"
run = "poc/benchmarks/konflux/tests-negatifs.sh"

[tasks."konflux:verifier"]
description = "Banc A1 : signature, provenance et Conforma (politique default) d'une image ; T7 (non signée, attestation seule)"
run = "poc/benchmarks/konflux/verifier.sh"

[tasks."konflux:preuves"]
description = "Banc A1 : preuves archivées (écarts d'intégration, sorties vers des tiers, rpm/deb, santé)"
run = "poc/benchmarks/konflux/preuves.sh"

[tasks."konflux:t6-hermetique"]
description = "Banc A1 : test négatif T6 (connexion réseau pendant un build hermétique)"
run = "poc/benchmarks/konflux/t6-hermetique.sh"

[tasks."konflux:demonter"]
description = "Banc A1 : supprime le cluster kind et son KUBECONFIG dédié"
run = '''
KUBECONFIG="$HOME/.kube/supply-chain-poc-konflux.yaml" kind delete cluster --name konflux
rm -f "$HOME/.kube/supply-chain-poc-konflux.yaml"
'''

[tasks."obs:preparer"]
description = "Banc A2 : appliance OBS épinglée (Unstable Build53.24) téléchargée, clé sur 3 canaux, signature et sha256 vérifiés"
run = "poc/benchmarks/obs/preparer.sh"

[tasks."obs:vm"]
description = "Banc A2 : pool, réseau NAT et VM sc-obs (creer|demarrer|arreter|detruire), sans démarrage automatique"
run = "poc/benchmarks/obs/vm.sh"

[tasks."obs:premier-acces"]
description = "Banc A2 : console série de sc-obs, mot de passe root et clé SSH remplacés, sshd activé"
run = "poc/benchmarks/obs/premier-acces.sh"

[tasks."obs:configurer"]
description = "Banc A2 : compte Admin, osc, worker (1 instance KVM, 3 Gi) et contrôles de la VM sc-obs"
run = "poc/benchmarks/obs/configurer.sh"

[tasks."obs:depots"]
description = "Banc A2 : clés sur 2 canaux, Debian 13 (instantané) et Rocky 9.7 (vault) en DoD vérifié, projet poc"
run = "poc/benchmarks/obs/depots.sh"

[tasks."packaging:sources"]
description = "Sources reproductibles de sample-app (vendor Go, marked vérifié) : archive, paquet source Debian, spec"
run = "poc/packaging/sources.sh"

[tasks."obs:construire"]
description = "Banc A2 : build de sample-app dans OBS (envoyer|reconstruire <libellé>), collecte des binaires, journaux et provenance"
run = "poc/benchmarks/obs/construire.sh"

[tasks."obs:tests"]
description = "Banc A2 : spec hostile (réseau, signd, clé, fausse provenance), signature DSSE des provenances, matériaux par digest"
run = "poc/benchmarks/obs/tests.sh"

[tasks."obs:etat"]
description = "Banc A2 : poids opérationnel de l'appliance (RAM au repos, services, disque) dans resultats/etat-<libellé>.log"
run = "poc/benchmarks/obs/etat.sh"

[tasks."obs:comparer"]
description = "Banc A2 : compare deux builds collectés (NEVRA, rpm hors signature, deb) dans resultats/comparaison-<A>-<B>.txt"
run = "poc/benchmarks/obs/comparer.sh"

[tasks."obs:horsligne"]
description = "Banc A2 : rebuild avec toute sortie de l'appliance bloquée et journalisée (nftables), comparé à un build de référence"
run = "poc/benchmarks/obs/horsligne.sh"

[tasks."obs:preuves"]
description = "Banc A2 : santé et pérennité d'OBS (commits humains sur 90 jours, auteurs, employeurs, licences, releases)"
run = "poc/benchmarks/obs/preuves.sh"

[tasks.bancs]
description = "Rejoue les bancs locaux de l'étape 4b (Zot et BuildKit rootless éphémères) ; journaux */resultats/*-laptop.*"
depends = ["outils"]
run = "poc/infra/bancs-laptop.sh"

[tasks."confiance:preparer"]
description = "Brique 08 : image Debian 13 generic (SHA512 sur 2 documents) et k3s v1.35.9+k3s1 (sha256 sur 2 sources) téléchargés et vérifiés"
run = "poc/bricks/08-trust-plane/preparer.sh"

[tasks."confiance:vm"]
description = "Brique 08 : pool, réseau NAT et VM sc-confiance, sc-build, sc-stockage (creer|demarrer|arreter|detruire), sans démarrage automatique"
run = "poc/bricks/08-trust-plane/vm.sh"

[tasks."confiance:k3s"]
description = "Brique 08 : k3s (server sur sc-confiance, agents sur sc-build et sc-stockage), sans install.sh ; kubeconfig dédié"
run = "poc/bricks/08-trust-plane/k3s.sh"

[tasks."confiance:controles"]
description = "Brique 08 : contrôles des nœuds (x86-64-v3, KVM, NAT) et du cluster ; journal resultats/controles-<libellé>.log"
run = "poc/bricks/08-trust-plane/controles.sh"

[tasks."confiance:stockage"]
description = "Brique 08, J2 : CA du PoC, Zot et Forgejo en services systemd sur sc-stockage, CA déclarée à containerd (étapes : pki zot registre containerd forgejo depot)"
run = "poc/bricks/08-trust-plane/stockage.sh"

[tasks."confiance:fuites"]
description = "Brique 08 : aucun secret de l'hôte dans les journaux des VM (journal systemd, /var/log, audit de l'API) ; journal resultats/fuites-<libellé>.log"
run = "poc/bricks/08-trust-plane/fuites.sh"

[tasks."confiance:openbao"]
description = "Brique 08, J3 : OpenBao 2.7.2 sur sc-confiance, Transit non exportable, JWT réservé au compte de service de Chains (étapes : image deployer initialiser configurer essais deverrouiller)"
run = "poc/bricks/08-trust-plane/openbao.sh"

[tasks."confiance:rejeu"]
description = "Brique 08 : rejeu complet depuis zéro des jalons faits (J1 à J6), puis contrôle des fuites ; journal resultats/rejeu-<libellé>.log"
run = "poc/bricks/08-trust-plane/rejeu.sh"

[tasks."confiance:redemarrer"]
description = "Brique 08 : redémarrage complet des trois VM, puis contrôle de Zot, Forgejo et OpenBao (descellé, même clé Transit) ; journal resultats/redemarrage-vm.log"
run = "poc/bricks/08-trust-plane/redemarrer.sh"

[tasks."confiance:tekton"]
description = "Brique 08, J4 : Tekton Pipelines v1.15.5, Chains v0.29.9, Triggers v0.37.2 épinglés par digest après revue, copiés dans Zot (étapes : revue miroir installer signature)"
run = "poc/bricks/08-trust-plane/tekton.sh"

[tasks."confiance:tsa"]
description = "Brique 08, J5 : horodatage RFC 3161, timestamp-authority v2.2.0 avec la clé Transit tsa, job d'horodatage et mesure des chemins de vérification (étapes : image pki openbao deployer temoin essais horodater chemins)"
run = "poc/bricks/08-trust-plane/tsa.sh"

[tasks."confiance:politique"]
description = "Brique 08, J6 : politique ; Kyverno v1.19.2 (images signées vérifiées, copiées dans Zot) à l'admission, Trusted Resources, EventListener en espace de confiance, horodatage automatique, rattrapage des webhooks perdus, Pod Security restricted des pods de build, porte de release (Conforma et sa bibliothèque), RBAC, posture des pipelines (tekton-lint 1.2.4, verrou npm) (étapes : image installer parite taches admission chains declencheurs restreint horodatage rattrapage porte droits posture)"
run = "poc/bricks/08-trust-plane/politique.sh"
