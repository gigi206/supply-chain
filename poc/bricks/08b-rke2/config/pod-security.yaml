# Brique 08b : Pod Security de RKE2, /etc/rancher/rke2/pod-security.yaml sur sc-confiance. Reprend les défauts du profil cis (pkg/rke2/psa.go
# au tag v1.35.9+rke2r1 : restricted partout, kube-system exempté), et ajoute la RuntimeClass kata, comme k3s/pod-security.yaml de la 08.
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
- name: PodSecurity
  configuration:
    apiVersion: pod-security.admission.config.k8s.io/v1
    kind: PodSecurityConfiguration
    defaults:
      enforce: restricted
      enforce-version: latest
      audit: restricted
      audit-version: latest
      warn: restricted
      warn-version: latest
    exemptions:
      usernames: []
      runtimeClasses: [kata]
      namespaces: [kube-system]
