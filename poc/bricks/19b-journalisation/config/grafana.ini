; Brique 19b, L2 : Grafana 13.3.0 sur sc-stockage (décisions D8 et D10 du propriétaire, 02/11/2026).
; Lecture : HTTPS sur 192.168.161.13:3001 (certificat de la CA du PoC) ; aucun accès anonyme, aucune inscription.
; Sources de données provisionnées depuis git, non modifiables dans l'interface. Aucun appel vers l'extérieur.
; Mot de passe de l'administrateur hors de ce fichier : /etc/grafana/secrets/admin.password (0640, groupe grafana).
[paths]
data = /var/lib/grafana
logs = /var/lib/grafana/log
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = https
http_addr = 192.168.161.13
http_port = 3001
domain = sc-stockage.poc.test
cert_file = /etc/grafana/tls/grafana.crt
cert_key = /etc/grafana/tls/grafana.key

[database]
type = sqlite3
path = grafana.db

[security]
admin_user = admin
admin_password = $__file{/etc/grafana/secrets/admin.password}
disable_gravatar = true
cookie_secure = true
strict_transport_security = true
content_security_policy = true

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = false

[snapshots]
enabled = false
external_enabled = false

[public_dashboards]
enabled = false

[unified_alerting]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[plugins]
preinstall_disabled = true
preinstall_auto_update = false

[log]
mode = console
