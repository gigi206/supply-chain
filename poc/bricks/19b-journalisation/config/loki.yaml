# Brique 19b, L2 : Loki 3.7.9 sur sc-stockage, binaire unique, stockage local (décisions D8, D10, D13 du propriétaire).
# Accès : HTTPS sur 192.168.161.13:3100, certificat client de la CA du PoC exigé (mTLS, D16) ; gRPC sur 127.0.0.1 seulement.
# Additif du 03/11/2026 (constat-grpc-relais.log) : le gRPC sert les mêmes routes que l'HTTP (pont httpgrpc de dskit) ; il exige
# donc lui aussi un certificat client de la CA du PoC. Les clients gRPC internes de Loki (binaire unique) présentent loki-interne.
# Intégrité (D10) : aucune suppression par l'API (deletion_mode: disabled) ; seule la rétention efface (30 jours, D13 a).
auth_enabled: false

server:
  http_listen_address: 192.168.161.13
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: info
  http_tls_config:
    cert_file: /etc/loki/tls/loki.crt
    key_file: /etc/loki/tls/loki.key
    client_auth_type: RequireAndVerifyClientCert
    client_ca_file: /etc/loki/tls/ca-poc.crt
  grpc_tls_config:
    cert_file: /etc/loki/tls/loki.crt
    key_file: /etc/loki/tls/loki.key
    client_auth_type: RequireAndVerifyClientCert
    client_ca_file: /etc/loki/tls/ca-poc.crt

# Clients gRPC internes (Loki se joint lui-même sur 127.0.0.1:9096) : certificat loki-interne, nom du certificat de loki.
ingester_client:
  grpc_client_config: &tls_interne
    tls_enabled: true
    tls_cert_path: /etc/loki/tls/loki-interne.crt
    tls_key_path: /etc/loki/tls/loki-interne.key
    tls_ca_path: /etc/loki/tls/ca-poc.crt
    tls_server_name: sc-stockage.poc.test

frontend:
  grpc_client_config: *tls_interne

frontend_worker:  # grpc_client_config est refusé avec les deux suivants (loki -verify-config)
  query_frontend_grpc_client: *tls_interne
  query_scheduler_grpc_client: *tls_interne

query_scheduler:
  grpc_client_config: *tls_interne

compactor_grpc_client: *tls_interne

ruler:
  ruler_client: *tls_interne

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-11-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /var/lib/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 720h
  deletion_mode: disabled
  reject_old_samples: true
  reject_old_samples_max_age: 168h

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
