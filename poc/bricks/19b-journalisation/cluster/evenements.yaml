# Brique 19b, L3 (J4) : compte de lecture des événements Kubernetes pour Alloy (sc-stockage, zone hors confiance).
# Seuls droits : get, list, watch sur les événements (core et events.k8s.io), tous espaces. Aucune lecture de Secret, de pod
# ni de journal. Jeton longue durée (Secret service-account-token), copié sur sc-stockage : même limite que prometheus-lecture.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-evenements
  namespace: observabilite
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: alloy-evenements-jeton
  namespace: observabilite
  annotations:
    kubernetes.io/service-account.name: alloy-evenements
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lecture-evenements
rules:
  - apiGroups: ["", "events.k8s.io"]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lecture-evenements
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: lecture-evenements}
subjects: [{kind: ServiceAccount, name: alloy-evenements, namespace: observabilite}]
