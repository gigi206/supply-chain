# Brique 05, M1b (carte resultats/m1b-carte.md, transpositions 2 à 4 de S4a retenues le 18/11/2026) : construction d'une image rpm
# (outillage de mock ou bootstrap) par le dnf de l'amorce, sans aucune entrée ni sortie réseau (NetworkPolicy propre à cette tâche,
# à poser sur accord avant tout TaskRun). Pod Kata privilégié, root, comme le pas construire de construire-rpm : il n'est admis que
# sous Kata (runtimeClassName posé par le PipelineRun) ; l'identifiant d'écriture de Zot n'y entre jamais (publier-image pousse).
#   - entrées : le miroir partiel écrit par prefetch-racine-rpm, monté en lecture seule ; revérifié ici contre les mêmes paramètres
#     (clés, repomd.xml, métadonnées, rpm de la liste, couche de base) ;
#   - installation sous la forme mesurée le 19/11/2026 (m1b-outil-forme.log pour l'outillage, m1b-pod_e.log pour le bootstrap) :
#     chemins /m de ces mesures (dnf.conf de la pipeline, au sha256 fixé ; miroir et clés liés au workspace), couche de base extraite
#     par le tar de l'amorce si la pipeline en donne une, dnf-3 sous env -i, limite de fichiers ouverts à 1024 (souple puis dure)
#     dans un sous-shell qui n'entoure que dnf (décision « Limite seule »), HOME=/m/h où .rpmmacros pose %_install_langs (décisions
#     « Absent » et « all, comme S1 »), umask 022, SOURCE_DATE_EPOCH=S, container=oci ; machine-id exclu ; racine en 0555 ;
#   - archive de la racine par le tar de l'amorce, options, borne S et exclusions des pods d'essai ; sha256 comparé à la valeur
#     fixée par la pipeline (racine) : une racine non reproduite arrête la tâche avant tout layout ;
#   - couche de configuration (outillage) : fichiers donnés par la pipeline (paramètre fichiers), archivés par la commande de
#     s1.sh (etape_image) ;
#   - layout OCI écrit à la main (choix 4), couches non compressées, sans date : image.tar dans le workspace sortie, que
#     publier-image (inchangée) pousse ; DIGEST_CONSTRUIT en résultat ;
#   - témoins qui doivent échouer : DNS, Zot (5000) et Forgejo (3000) de sc-stockage ; pic du tmpfs échantillonné chaque seconde
#     (Kata ignore sizeLimit, mesure de la 06).
# Entrées par substitution de Tekton dans le script, jamais par variable d'environnement (voir prefetch-racine-rpm).
# @AMORCE@ : m1b-builders.sh. Signée une fois, versionnée (construire-racine-rpm.signee.yaml), digest dans la liste revue.
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: construire-racine-rpm
spec:
  params:
  - name: depots
    type: string
  - name: liste
    type: string
  - name: cles
    type: string
  - name: couche
    type: string
  - name: dnf_conf
    type: string
  - name: dnf_conf_sha256
    type: string
  - name: noms
    type: string
  - name: langue
    type: string
  - name: sde
    type: string
  - name: racine
    type: string
  - name: fichiers
    type: string
  - name: config
    type: string
  - name: annotations
    type: string
  workspaces:
  - name: entrees
    readOnly: true
  - name: sortie
  results:
  - name: DIGEST_CONSTRUIT
    type: string
  volumes:
  - name: w
    emptyDir:
      medium: Memory
      sizeLimit: 4Gi
  - name: tmp
    emptyDir: {}
  steps:
  - name: construire
    image: @AMORCE@
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    resources:
      requests:
        cpu: "2"
        memory: 6Gi
      limits:
        cpu: "2"
        memory: 6Gi
    volumeMounts:
    - name: w
      mountPath: /w
    - name: tmp
      mountPath: /tmp
    script: |
      #!/bin/bash
      set -euo pipefail
      export LC_ALL=C
      umask 022
      # Entrées fixées par la pipeline signée (substitution de Tekton) ; lignes vides ignorées dans les listes.
      cat > /tmp/depots <<'FIN_DEPOTS'
      $(params.depots)
      FIN_DEPOTS
      cat > /tmp/liste <<'FIN_LISTE'
      $(params.liste)
      FIN_LISTE
      cat > /tmp/cles <<'FIN_CLES'
      $(params.cles)
      FIN_CLES
      cat > /tmp/dnf.conf <<'FIN_DNF_CONF'
      $(params.dnf_conf)
      FIN_DNF_CONF
      cat > /tmp/fichiers <<'FIN_FICHIERS'
      $(params.fichiers)
      FIN_FICHIERS
      COUCHE='$(params.couche)'
      DNF_SHA='$(params.dnf_conf_sha256)'
      NOMS='$(params.noms)'
      LANGUE='$(params.langue)'
      SDE='$(params.sde)'
      RACINE='$(params.racine)'
      CONFIG='$(params.config)'
      ANNOT='$(params.annotations)'
      e='$(workspaces.entrees.path)'
      o='$(workspaces.sortie.path)'
      R='$(results.DIGEST_CONSTRUIT.path)'
      ko() { echo "KO   $*" >&2; exit 1; }
      hex() { case $1 in *[!0-9a-f]*|'') return 1 ;; esac; [ ${#1} = "$2" ]; }
      for x in dnf-3 rpm tar gzip sha256sum python3 gpg timeout getent find stat; do command -v "$x" > /dev/null 2>&1 || ko "$x absent de l'image"; done
      # Contrôles des paramètres (les listes sont recontrôlées par la revérification)
      [ "$COUCHE" = - ] || hex "$COUCHE" 64 || ko "sha256 de la couche invalide"
      hex "$DNF_SHA" 64 || ko "sha256 de dnf.conf invalide"
      hex "$RACINE" 64 || ko "sha256 de la racine invalide"
      case $SDE in *[!0-9]*|'') ko "SOURCE_DATE_EPOCH invalide" ;; esac
      case $LANGUE in *[!A-Za-z_]*|'') ko "langue invalide : $LANGUE" ;; esac
      case $NOMS in *[!A-Za-z0-9._+:\ -]*|'') ko "noms invalides" ;; esac
      python3 -I - "$CONFIG" "$ANNOT" <<'PY' || ko "config ou annotations : JSON invalide"
      import json, sys
      c, a = (json.loads(x) for x in sys.argv[1:3])
      assert isinstance(c, dict) and isinstance(a, dict) and all(isinstance(v, str) for v in a.values())
      assert sys.argv[1] == json.dumps(c, separators=(',', ':')) and sys.argv[2] == json.dumps(a, separators=(',', ':'))
      PY
      python3 -I -c 'import sys; t = open(sys.argv[1]).read().strip("\n"); open(sys.argv[1], "w").write(t + "\n")' /tmp/dnf.conf
      [ "$(sha256sum < /tmp/dnf.conf | cut -c1-64)" = "$DNF_SHA" ] || ko "dnf.conf différent du sha256 fixé"
      ! touch "$e/.ecriture" 2> /dev/null || ko "workspace entrees inscriptible"
      [ -z "$(ls -A /w)" ] || ko "/w non vide"
      [ ! -e "$o/image.tar" ] || ko "workspace sortie déjà rempli"
      [ ! -e /m ] || ko "/m existe déjà dans l'image"
      echo "invité : $(uname -r), $(nproc) vCPU, $(awk '/MemTotal/ {print $2}' /proc/meminfo) kB ; uid $(id -u) ; /w : $(awk '$2 == "/w" {print $3}' /proc/mounts) ; entrees : $(awk -v p="$e" '$2 == p {print $3, $4}' /proc/mounts), écriture refusée"
      echo "versions : $(rpm -q --qf '%{NEVRA} ' rpm dnf python3-dnf libsolv libdnf tar)"
      pic() { echo "tmpfs /w : $(du -sm /w | cut -f1) Mo ($1)"; }
      ( while :; do du -sm /w 2> /dev/null | cut -f1; sleep 1; done ) > /tmp/pic.txt &
      ech=$!
      trap 'kill $ech 2> /dev/null || true' EXIT
      # Témoins : aucune sortie réseau (code relevé ; 124 : délai)
      r=0; timeout 10 getent hosts dl.rockylinux.org > /dev/null 2>&1 || r=$?
      [ $r != 0 ] || ko "DNS résolu (dl.rockylinux.org)"
      echo "témoin DNS dl.rockylinux.org : échec, code $r (attendu)"
      for c in 192.168.161.13/5000 192.168.161.13/3000; do
        r=0; timeout 10 bash -c "exec 3<>/dev/tcp/$c" 2> /dev/null || r=$?
        [ $r != 0 ] || ko "$c joint"
        echo "témoin TCP $c : échec, code $r (attendu)"
      done
      # Revérification des entrées
      while read -r nom sha empreinte; do
        [ -n "$nom" ] || continue
        [ "$(sha256sum < "$e/cles/$nom" | cut -c1-64)" = "$sha" ] || ko "clé altérée : $nom"
        [ "$(HOME=/tmp gpg --batch --with-colons --show-keys "$e/cles/$nom" 2> /dev/null | awk -F: '$1 == "fpr" {print $10; exit}')" = "$empreinte" ] \
          || ko "empreinte de la clé : $nom"
      done < /tmp/cles
      nd=0
      while read -r nom url sha sig; do
        [ -n "$nom" ] || continue
        [ "$(sha256sum < "$e/miroir/$nom/repodata/repomd.xml" | cut -c1-64)" = "$sha" ] || ko "$nom : repomd.xml altéré"
        [ "$sig" = - ] || [ -s "$e/miroir/$nom/repodata/repomd.xml.asc" ] || ko "$nom : signature de repomd.xml absente"
        python3 -I - "$e/miroir/$nom" <<'PY' || ko "$nom : métadonnées altérées"
      import hashlib, sys, xml.etree.ElementTree as E
      n = {'r': 'http://linux.duke.edu/metadata/repo'}
      for d in E.parse(f'{sys.argv[1]}/repodata/repomd.xml').getroot().findall('r:data', n):
          if d.get('type').endswith('_db'):
              continue
          h = d.find('r:location', n).get('href')
          assert hashlib.sha256(open(f'{sys.argv[1]}/{h}', 'rb').read()).hexdigest() == d.find('r:checksum', n).text, h
      PY
        nd=$((nd + 1))
      done < /tmp/depots
      n=0
      while read -r dep f sha; do
        case $dep in ''|'#'*) continue ;; esac
        p=$(find "$e/miroir/$dep" -type f -name "$f")
        [ "$(grep -c . <<< "$p")" = 1 ] || ko "rpm absent ou en double : $dep $f"
        [ "$(sha256sum < "$p" | cut -c1-64)" = "$sha" ] || ko "rpm altéré : $dep $f"
        n=$((n + 1))
      done < /tmp/liste
      [ "$COUCHE" = - ] || [ "$(sha256sum < "$e/couche.tar.gz" | cut -c1-64)" = "$COUCHE" ] || ko "couche altérée"
      echo "entrées revérifiées : $(grep -c . /tmp/cles) clé(s), $nd dépôt(s), $n rpm, couche $([ "$COUCHE" = - ] && echo aucune || echo "${COUCHE:0:12}…")"
      # Chemins /m des mesures
      mkdir -p /w/m/aucun /w/m/h
      ln -s "$e/miroir" /w/m/miroir
      ln -s "$e/cles" /w/m/cles
      cp /tmp/dnf.conf /w/m/dnf.conf
      printf '%%_install_langs %s\n' "$LANGUE" > /w/m/h/.rpmmacros
      ln -s /w/m /m
      l=$(env -i PATH=/usr/sbin:/usr/bin HOME=/m/h LC_ALL=C python3 -c 'import rpm; print(rpm.expandMacro("%_install_langs"))')
      [ "$l" = "$LANGUE" ] || ko "langue lue par rpm de python : [$l]"
      echo "%_install_langs lu par rpm de python, env -i HOME=/m/h : [$l] ; umask $(umask)"
      if [ "$COUCHE" != - ]; then
        mkdir /m/i
        r=0; tar -xzf "$e/couche.tar.gz" -C /m/i --numeric-owner --xattrs --xattrs-include='*' 2> /tmp/ext.err || r=$?
        [ $r = 0 ] && [ ! -s /tmp/ext.err ] || { head -c 400 /tmp/ext.err >&2; ko "extraction de la couche : code $r"; }
        echo "couche extraite par le tar de l'amorce : racine $(stat -c %a /m/i) ; rpm -qa avant : $(rpm --root /m/i -qa 2> /dev/null | wc -l) lignes"
      fi
      pic "avant dnf"
      t=$(date +%s)
      r=0
      ( ulimit -Sn 1024 && ulimit -Hn 1024 || exit 97; echo "$(ulimit -Sn) / $(ulimit -Hn)" > /tmp/lim.txt
        cd / && exec env -i PATH=/usr/sbin:/usr/bin HOME=/m/h LC_ALL=C container=oci SOURCE_DATE_EPOCH="$SDE" /usr/bin/dnf-3 -y -c /m/dnf.conf \
          --setopt=reposdir=/m/aucun --setopt=cachedir=/m/cache --installroot=/m/i --releasever=9 install $NOMS < /dev/null ) > /w/dnf.log 2>&1 || r=$?
      echo "limite de fichiers ouverts dans le sous-shell de dnf : $(cat /tmp/lim.txt 2> /dev/null) ; limite du shell après : $(ulimit -Sn) / $(ulimit -Hn)"
      echo "dnf-3 code $r en $(($(date +%s) - t)) s ; $(wc -l < /w/dnf.log) lignes de journal"
      [ $r = 0 ] || { tail -n 30 /w/dnf.log >&2; ko "dnf-3"; }
      grep -E '^(Install|Upgrade|Remove|Downgrade|Reinstall|Skip) +[0-9]+ Package' /w/dnf.log | sed 's/^/résumé de la transaction : /' || true
      echo "paquets installés : $(rpm --root=/m/i -qa | wc -l), dont gpg-pubkey $(rpm --root=/m/i -qa gpg-pubkey | wc -l)"
      pic "après dnf"
      chmod 0555 /m/i
      echo "racine passée en $(stat -c %a /m/i) ; etc/machine-id : $(stat -c '%s octet(s)' /m/i/etc/machine-id 2> /dev/null || echo absent), exclu de l'archive"
      r=0
      tar --sort=name --format=posix --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime --mtime="@$SDE" --clamp-mtime \
        --xattrs --xattrs-include='*' --numeric-owner \
        --exclude=./var/log/dnf.log --exclude=./var/log/dnf.librepo.log --exclude=./var/log/dnf.rpm.log --exclude=./var/log/hawkey.log \
        --exclude=./var/lib/dnf/history.sqlite --exclude=./var/lib/dnf/history.sqlite-shm --exclude=./var/lib/dnf/history.sqlite-wal \
        --exclude=./var/cache/ldconfig/aux-cache --exclude=./var/cache/dnf --exclude=./m --exclude=./etc/machine-id \
        -C /m/i -cf /w/racine.tar . 2> /tmp/tar.err || r=$?
      [ $r = 0 ] && [ ! -s /tmp/tar.err ] || { head -c 400 /tmp/tar.err >&2; ko "tar de la racine : code $r"; }
      l1=$(sha256sum < /w/racine.tar | cut -c1-64); s1=$(stat -c %s /w/racine.tar)
      echo "racine : $s1 octets, $(tar -tf /w/racine.tar | wc -l) membres, sha256 $l1"
      [ "$l1" = "$RACINE" ] || ko "racine différente de la valeur fixée par la pipeline ($RACINE)"
      echo "racine conforme à la valeur fixée par la pipeline"
      rm -r -f /m/i /m/cache
      pic "racine archivée, arbre retiré"
      # Couche de configuration (facultative) : blocs « === chemin » de la pipeline, fichiers 0644 et dossiers 0755
      couches=("$l1 $s1")
      if [ "$(sed -n '1p' /tmp/fichiers)" != - ]; then
        python3 -I - /tmp/fichiers /w/cc <<'PY' || ko "paramètre fichiers invalide"
      import os, re, sys
      src, dst = sys.argv[1:]
      blocs, cur = [], None
      for l in open(src, encoding='utf-8').read().split('\n'):
          if l.startswith('=== '):
              cur = [l[4:], []]; blocs.append(cur)
          elif cur is None:
              assert l == '', 'texte avant le premier bloc'
          else:
              cur[1].append(l)
      assert blocs, 'aucun bloc'
      for chemin, lignes in blocs:
          assert re.fullmatch(r'[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*', chemin) and '..' not in chemin.split('/'), chemin
          while lignes and lignes[-1] == '':
              lignes.pop()
          f = os.path.join(dst, chemin)
          assert not os.path.exists(f), chemin
          os.makedirs(os.path.dirname(f), mode=0o755, exist_ok=True)
          with open(f, 'w', encoding='utf-8') as h:
              h.write('\n'.join(lignes) + '\n')
          os.chmod(f, 0o644)
          print(f'fichier de configuration {chemin} : {os.path.getsize(f)} octets')
      PY
        ( cd /w/cc && find . -type f | sed 's|^\./||' | sort | xargs sha256sum ) | sed 's/^/sha256 /'
        mapfile -t hauts < <(cd /w/cc && ls -A | sort)
        tar --sort=name --format=posix --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime --mtime=@0 \
          --owner=0 --group=0 --numeric-owner -C /w/cc -cf /w/couche-config.tar "${hauts[@]}"
        l2=$(sha256sum < /w/couche-config.tar | cut -c1-64); s2=$(stat -c %s /w/couche-config.tar)
        echo "couche de configuration : $s2 octets, sha256 $l2"
        couches+=("$l2 $s2")
      fi
      # Layout OCI à la main : couches non compressées, un seul manifeste, aucune date
      L=/w/layout
      mkdir -p "$L/blobs/sha256"
      mv /w/racine.tar "$L/blobs/sha256/$l1"
      [ ${#couches[@]} = 1 ] || mv /w/couche-config.tar "$L/blobs/sha256/$l2"
      blob() { # contenu : blob JSON écrit, « sha256 taille » sur la sortie
        local h
        h=$(printf '%s' "$1" | sha256sum | cut -c1-64)
        printf '%s' "$1" > "$L/blobs/sha256/$h"
        echo "$h ${#1}"
      }
      di=; ly=
      for c in "${couches[@]}"; do
        di=$di${di:+,}'"sha256:'${c% *}'"'
        ly=$ly${ly:+,}'{"mediaType":"application/vnd.oci.image.layer.v1.tar","digest":"sha256:'${c% *}'","size":'${c#* }'}'
      done
      cfg=$(blob '{"architecture":"amd64","config":'"$CONFIG"',"os":"linux","rootfs":{"type":"layers","diff_ids":['"$di"']}}')
      an=; [ "$ANNOT" = '{}' ] || an=',"annotations":'$ANNOT
      man=$(blob '{"schemaVersion":2,"mediaType":"application/vnd.oci.image.manifest.v1+json","config":{"mediaType":"application/vnd.oci.image.config.v1+json","digest":"sha256:'"${cfg% *}"'","size":'"${cfg#* }"'},"layers":['"$ly"']'"$an"'}')
      printf '%s' '{"imageLayoutVersion":"1.0.0"}' > "$L/oci-layout"
      printf '%s' '{"schemaVersion":2,"mediaType":"application/vnd.oci.image.index.v1+json","manifests":[{"mediaType":"application/vnd.oci.image.manifest.v1+json","digest":"sha256:'"${man% *}"'","size":'"${man#* }"'}]}' > "$L/index.json"
      echo "couches : ${#couches[@]} ; configuration sha256:${cfg% *} (${cfg#* } octets) ; manifeste sha256:${man% *} (${man#* } octets)"
      t=$(date +%s)
      tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$L" -cf "$o/image.tar" oci-layout index.json blobs
      echo "image.tar : $(stat -c %s "$o/image.tar") octets, sha256 $(sha256sum < "$o/image.tar" | cut -c1-64), en $(($(date +%s) - t)) s"
      kill $ech 2> /dev/null || true
      echo "pic du tmpfs /w : $(sort -n /tmp/pic.txt | tail -n 1) Mo sur $(grep -c . /tmp/pic.txt) relevés ; memory.peak du cgroup : $(cat /sys/fs/cgroup/memory.peak 2> /dev/null || echo absent)"
      printf 'sha256:%s' "${man% *}" > "$R"
