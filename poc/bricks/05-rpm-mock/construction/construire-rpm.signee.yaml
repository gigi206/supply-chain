apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  annotations:
    tekton.dev/signature: MEUCIQDdG9vL4JCBHDePNI7YGqTWihCdfeyYSnUud/OnNnTXogIgAY7QbMfDN3oXq1tn01XHsMSkxFvDTMD1XQfq7PU4uLo=
  name: construire-rpm
spec:
  params:
  - name: epoque
    type: string
  results:
  - name: DIGEST_CONSTRUIT
    type: string
  steps:
  - env:
    - name: EPOQUE
      value: $(params.epoque)
    image: sc-stockage.poc.test:5000/essais-05/mock-rocky9@sha256:99790c13673de2e4b87e72207b4b29eff7ef95dc436d79d25c08e627027f6771
    name: construire
    resources:
      limits:
        cpu: "2"
        memory: 6Gi
      requests:
        cpu: "2"
        memory: 6Gi
    script: |
      #!/bin/bash
      set -euo pipefail
      export LC_ALL=C
      umask 022
      e=$(workspaces.entrees.path)
      o=$(workspaces.sortie.path)
      case $EPOQUE in ''|*[!0-9]*) echo "époque invalide : $EPOQUE" >&2; exit 1 ;; esac
      for x in rpm mock python3 tar gzip sha256sum stat find timeout getent; do command -v $x > /dev/null || { echo "$x absent de l'image" >&2; exit 1; }; done
      ! touch "$e/.ecriture" 2> /dev/null || { echo "workspace entrees inscriptible" >&2; exit 1; }
      echo "invité : $(uname -r), $(nproc) vCPU, $(awk '/MemTotal/ {print $2}' /proc/meminfo) kB ; uid $(id -u), gid $(id -g) ; /w : $(awk '$2 == "/w" {print $3}' /proc/mounts) ; entrees : $(awk -v p="$e" '$2 == p {print $3, $4}' /proc/mounts), écriture refusée"
      echo "$(rpm -q --qf '%{NEVRA}' mock) ; $(tar --version | head -1) ; $(gzip --version | head -1)"
      # Témoins : aucune sortie réseau (mêmes cibles que construire-deb, nom de Rocky pour le DNS). Code relevé (124 : délai).
      r=0; timeout 10 getent hosts dl.rockylinux.org > /dev/null 2>&1 || r=$?
      [ $r != 0 ] || { echo "KO   DNS résolu (dl.rockylinux.org)" >&2; exit 1; }
      echo "témoin DNS dl.rockylinux.org : échec, code $r (attendu)"
      for c in 192.168.161.13/5000 192.168.161.13/3000 199.232.170.132/80; do
        r=0; timeout 10 bash -c "exec 3<>/dev/tcp/$c" 2> /dev/null || r=$?
        [ $r != 0 ] || { echo "KO   $c joint" >&2; exit 1; }
        echo "témoin TCP $c : échec, code $r (attendu)"
      done
      # Fermeture recopiée dans /w, puis confrontée au verrou
      cp -a "$e/fermeture" /w/fermeture
      cp "$e/verrou-rpm.json" /w/verrou.json
      D=/w/fermeture/depot
      read -r dos id < <(python3 -I - /w/verrou.json "$D" <<'FIN'
      import hashlib, json, os, stat, subprocess, sys
      v, d = sys.argv[1:]
      j = json.load(open(v, encoding='utf-8'))
      pd = j['bootstrap']['pull_digest']
      if not pd.startswith('sha256:') or len(pd) != 71:
          sys.exit(f'pull_digest illisible : {pd}')
      dos = j['config']['bootstrap_image'].split(':', 1)[0] + '@' + pd
      noms = {}
      for p in j['buildroot']['rpms']:
          n = p['url'].rsplit('/', 1)[-1]
          if not n.endswith('.rpm') or n.startswith('.') or n in noms or n in ('repodata', dos):
              sys.exit(f'nom du verrou non admis ou en double : {n}')
          noms[n] = p['sigmd5']
      if not noms:
          sys.exit('verrou vide')
      rpms, autres, n_repodata, n_dos = set(), [], 0, 0
      for racine, dirs, fichiers in os.walk(d):
          rel = os.path.relpath(racine, d)
          for x in dirs:
              q = os.path.normpath(os.path.join(rel, x))
              if q not in ('repodata', dos) or os.path.islink(os.path.join(racine, x)):
                  autres.append(q + '/')
          for x in fichiers:
              q = os.path.normpath(os.path.join(rel, x)); f = os.path.join(racine, x)
              if not stat.S_ISREG(os.lstat(f).st_mode):
                  autres.append(q)
              elif rel == '.' and x in noms:
                  rpms.add(x)
              elif rel == 'repodata':
                  n_repodata += 1
              elif rel == dos:
                  n_dos += 1
              else:
                  autres.append(q)
      if autres:
          sys.exit(f'fermeture : {len(autres)} objet(s) hors du verrou, de repodata/ et du dossier dir: : {sorted(autres)[:5]}')
      if rpms != set(noms):
          sys.exit(f'fermeture : {len(set(noms) - rpms)} rpm du verrou absent(s) : {sorted(set(noms) - rpms)[:5]}')
      for n in sorted(noms):
          s = subprocess.run(['rpm', '-qp', '--qf', '%{SIGMD5}', os.path.join(d, n)], capture_output=True, text=True).stdout
          if s != noms[n]:
              sys.exit(f'sigmd5 différent du verrou : {n} ({s})')
      m = hashlib.sha256(open(os.path.join(d, dos, 'manifest.json'), 'rb').read()).hexdigest()
      if 'sha256:' + m != pd:
          sys.exit(f'manifest.json du dossier dir: différent du pull_digest : sha256:{m}')
      if not os.path.isfile(os.path.join(d, 'repodata', 'repomd.xml')):
          sys.exit('repodata/repomd.xml absent')
      print(f'fermeture confrontée au verrou : {len(rpms)} rpm (noms et sigmd5), image de bootstrap (manifest.json égal au pull_digest), repodata {n_repodata} fichiers, dossier dir: {n_dos} fichiers, aucun autre objet', file=sys.stderr)
      if len(j['bootstrap']['image_digest']) != 64:
          sys.exit('image_digest illisible')
      print(dos, j['bootstrap']['image_digest'])
      FIN
      )
      [ -n "${id:-}" ] || { echo "confrontation au verrou en échec" >&2; exit 1; }
      echo "dossier dir: $dos ; image_digest du verrou $id"
      # Archive Source0 (commande tar de sources.sh), datée par l'époque de la pipeline ; spec à côté
      s=$e/sample-app.spec
      nom=$(awk '$1 == "Name:" {print $2}' "$s"); ver=$(awk '$1 == "Version:" {print $2}' "$s")
      [ "$(awk '$1 == "Source0:" {print $2}' "$s")" = '%{name}-%{version}.tar.gz' ] || { echo "Source0 du spec inattendue" >&2; exit 1; }
      case $nom-$ver in *[!A-Za-z0-9._+-]*|-*) echo "nom ou version du spec inattendus : $nom $ver" >&2; exit 1 ;; esac
      mkdir -p /w/arbre /w/sources
      cp -a "$e/src" "/w/arbre/$nom-$ver"
      tar -C /w/arbre --sort=name --mtime="@$EPOQUE" --owner=0 --group=0 --numeric-owner --mode=go-w,a+rX \
        --format=gnu -cf - "$nom-$ver" | gzip -n -9 > "/w/sources/$nom-$ver.tar.gz"
      cp "$s" /w/sources/
      echo "Source0 $nom-$ver.tar.gz (époque $EPOQUE) : $(sha256sum < "/w/sources/$nom-$ver.tar.gz" | cut -c1-64) ; spec $(sha256sum < /w/sources/sample-app.spec | cut -c1-64)"
      # mock hermétique, hors ligne
      df -k /w | awk 'NR == 2 {print "avant mock, capacité de /w : " $2 " kB ; utilisés : " $3 " kB"}'
      t=$(date +%s); r=0
      mock --hermetic-build /w/verrou.json "$D" --isolation=simple --no-cleanup-after --config-opts=basedir=/w/mock \
        --config-opts=cache_topdir=/w/mock-cache --resultdir=/w/res --spec /w/sources/sample-app.spec --sources /w/sources \
        > /w/mock.out 2>&1 || r=$?
      echo "mock --hermetic-build : rc $r en $(($(date +%s) - t)) s"
      for m in "Using container image: dir:" "Checking image digest: $id" "falling back to chroot installation" "Expected digest for image" "No space left on device"; do
        echo "lignes « $m » : sortie $(grep -c -F -e "$m" /w/mock.out || true) ; root.log $(grep -c -F -e "$m" /w/res/root.log 2> /dev/null || true)"
      done
      for f in /w/mock.out /w/res/root.log /w/res/build.log; do echo "lignes http ou https de ${f##*/} : $(grep -c -E 'https?://' "$f" 2> /dev/null || true)"; done
      if [ $r != 0 ]; then   # journaux de mock lisibles dans le TaskRun : /w disparaît avec le pod
        echo "----- fin de mock.out -----" >&2; tail -n 80 /w/mock.out >&2
        for f in /w/res/root.log /w/res/build.log; do
          [ ! -e "$f" ] || { echo "----- fin de ${f##*/} -----" >&2; tail -n 60 "$f" >&2; }
        done
        echo "mock en échec" >&2; exit 1
      fi
      rpm -qa --root /w/mock/hermetic-build/root --qf 'paquet %{NAME} %{VERSION} %{RELEASE} %{ARCH} %{SIGMD5}\n' | sort
      echo "paquets du buildroot (rpm --root) : $(rpm -qa --root /w/mock/hermetic-build/root | wc -l)"
      df -k /w | awk 'NR == 2 {print "après mock (buildroot gardé), capacité de /w : " $2 " kB ; utilisés : " $3 " kB"}'
      shopt -s nullglob
      sr=(/w/res/*.src.rpm)
      [ ${#sr[@]} = 1 ] || { echo "${#sr[@]} src.rpm produits, 1 attendu" >&2; exit 1; }
      b=()
      for f in /w/res/*.rpm; do [ "$f" = "${sr[0]}" ] || b+=("$f"); done
      [ ${#b[@]} = 1 ] || { echo "${#b[@]} rpm binaires produits, 1 attendu" >&2; exit 1; }
      p=${b[0]}
      for f in "${sr[0]}" "$p"; do
        echo "rpm : ${f##*/} sha256 $(sha256sum < "$f" | cut -c1-64) ($(stat -c %s "$f") octets) ; NEVRA $(rpm -qp --qf '%{NEVRA} ; BUILDHOST %{BUILDHOST} ; BUILDTIME %{BUILDTIME}' "$f" 2> /dev/null)"
      done
      # Layout OCI à la main : configuration d'image, une couche tar non compressée qui contient le rpm binaire seul
      L=/w/layout
      mkdir -p "$L/blobs/sha256" /w/cc
      cp "$p" /w/cc/
      chmod 0644 "/w/cc/${p##*/}"
      tar --sort=name --format=posix --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime --mtime=@0 \
        --owner=0 --group=0 --numeric-owner -C /w/cc -cf /w/couche.tar "${p##*/}"
      l=$(sha256sum < /w/couche.tar | cut -c1-64); z=$(stat -c %s /w/couche.tar)
      mv /w/couche.tar "$L/blobs/sha256/$l"
      blob() { # contenu : blob JSON écrit, « sha256 taille » sur la sortie
        local h
        h=$(printf '%s' "$1" | sha256sum | cut -c1-64)
        printf '%s' "$1" > "$L/blobs/sha256/$h"
        echo "$h ${#1}"
      }
      cfg=$(blob '{"architecture":"amd64","os":"linux","rootfs":{"type":"layers","diff_ids":["sha256:'"$l"'"]}}')
      man=$(blob '{"schemaVersion":2,"mediaType":"application/vnd.oci.image.manifest.v1+json","config":{"mediaType":"application/vnd.oci.image.config.v1+json","digest":"sha256:'"${cfg% *}"'","size":'"${cfg#* }"'},"layers":[{"mediaType":"application/vnd.oci.image.layer.v1.tar","digest":"sha256:'"$l"'","size":'"$z"'}]}')
      printf '%s' '{"imageLayoutVersion":"1.0.0"}' > "$L/oci-layout"
      printf '%s' '{"schemaVersion":2,"mediaType":"application/vnd.oci.image.index.v1+json","manifests":[{"mediaType":"application/vnd.oci.image.manifest.v1+json","digest":"sha256:'"${man% *}"'","size":'"${man#* }"'}]}' > "$L/index.json"
      echo "couche sha256:$l ($z octets) ; configuration sha256:${cfg% *} ; manifeste sha256:${man% *}"
      tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$L" -cf "$o/image.tar" oci-layout index.json blobs
      echo "image.tar : $(stat -c %s "$o/image.tar") octets"
      printf 'sha256:%s' "${man% *}" > $(results.DIGEST_CONSTRUIT.path)
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
    volumeMounts:
    - mountPath: /w
      name: w
  volumes:
  - emptyDir:
      medium: Memory
      sizeLimit: 4Gi
    name: w
  workspaces:
  - name: entrees
    readOnly: true
  - name: sortie
