        value: construire-rpm
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: entrees
      subPath: entrees
      workspace: sortie
    - name: sortie
      subPath: image
      workspace: sortie
  - name: publier
    params:
    - name: image
      value: sc-stockage.poc.test:5000/builds/sample-app-rpm
    - name: digest
      value: $(tasks.construire.results.DIGEST_CONSTRUIT)
    taskRef:
      params:
      - name: bundle
        value: sc-stockage.poc.test:5000/tekton/tasks/publier-image@sha256:d21931f3807b4306a55a20488c9c6db1ef33613fa3143207f95fd7428c16b36b
