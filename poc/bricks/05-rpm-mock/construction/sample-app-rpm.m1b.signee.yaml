        value: preparer-rpm
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: sortie
      workspace: sortie
  - name: construire
    params:
    - name: epoque
      value: "1793229566"
    runAfter:
    - preparer
    taskRef:
      params:
      - name: bundle
        value: sc-stockage.poc.test:5000/tekton/tasks/construire-rpm@sha256:ca03f18908d0b5e73edc57ecf9610513e2907267ce1da2d9f41fd36b969289c5
