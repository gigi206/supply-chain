  results:
  - description: ""
    name: IMAGE_URL
    value: $(tasks.publier.results.IMAGE_URL)
  - description: ""
    name: IMAGE_DIGEST
    value: $(tasks.publier.results.IMAGE_DIGEST)
  tasks:
  - name: preparer
    params:
    - name: depot
      value: $(params.depot)
    - name: commit
      value: $(params.commit)
    - name: fermeture-rpm
      value: sc-stockage.poc.test:5000/builds/fermetures/sample-app-rpm@sha256:0983898054a9b96e51f54a2c13ad5919f999e6bccf61ecade0eb8cab5a30e28f
