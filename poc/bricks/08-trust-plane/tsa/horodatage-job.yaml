# Brique 08, jalon J5 : un job d'horodatage par image (tsa.sh horodater). @OUTILS@ : image d'outils assemblée
# (base cosign v3.1.4-dev signée, plus oras et timestamp-cli vérifiés), épinglée par digest (tsa.sh image). @BAO@ : image
# d'OpenBao (openbao.sh). J8 : identifiants Zot lus dans OpenBao par le conteneur d'initialisation (tsa/horodatage-zot.hcl),
# dans un volume en mémoire ; le jeton projeté d'audience openbao n'est monté que dans ce conteneur.
apiVersion: batch/v1
kind: Job
metadata:
  name: @NOM@
  namespace: horodatage
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: horodatage
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      nodeSelector:
        zone: confiance
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: identifiants
        image: @BAO@
        command: [sh, -c]
        args:
        - |
          set -eu
          umask 077
          # Identifiants Zot (compte poc-horodatage) lus dans OpenBao, jamais dans un Secret : connexion JWT (rôle horodatage,
          # jeton projeté d'audience openbao), lecture, révocation du jeton. Quelques essais : le réseau d'un pod neuf (J3).
          n=1
          until BAO_TOKEN=$(bao write -field=token auth/jwt/login role=horodatage jwt=@/var/run/secrets/openbao/token \
              2> /var/run/zot/erreur); do
            [ $n -lt 30 ] || { cat /var/run/zot/erreur >&2; exit 1; }
            n=$((n + 1)); sleep 1
          done
          rm -f /var/run/zot/erreur
          export BAO_TOKEN
          bao read -field=config.json kv/horodatage/zot > /var/run/zot/config.json
          bao token revoke -self >/dev/null
          echo "identifiants Zot lus dans OpenBao (rôle horodatage, essai $n) ; jeton révoqué"
        env:
        - name: BAO_ADDR
          value: https://openbao.openbao.svc.cluster.local:8200
        - name: BAO_CACERT
          value: /etc/horodatage/ca-poc.crt
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: zot
          mountPath: /var/run/zot
        - name: config
          mountPath: /etc/horodatage
          readOnly: true
        - name: openbao-jeton
          mountPath: /var/run/secrets/openbao
          readOnly: true
      containers:
      - name: horodater
        image: @OUTILS@
        command: [sh, /etc/horodatage/horodater.sh]
        env:
        - name: IMAGE
          value: @IMAGE@
        - name: DEPOT
          value: @DEPOT@
        - name: TSA
          value: http://timestamp-authority.tsa.svc.cluster.local:3000
        - name: HOME
          value: /travail
        - name: TMPDIR
          value: /travail
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: travail
          mountPath: /travail
        - name: config
          mountPath: /etc/horodatage
          readOnly: true
        - name: zot
          mountPath: /var/run/zot
          readOnly: true
      volumes:
      - name: travail
        emptyDir:
          sizeLimit: 64Mi
      - name: config
        configMap:
          name: horodatage
      - name: zot
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: openbao-jeton
        projected:
          sources:
          - serviceAccountToken:
              audience: openbao
              expirationSeconds: 600
              path: token
