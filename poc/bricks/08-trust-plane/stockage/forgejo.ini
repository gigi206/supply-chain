; Brique 08, jalon J2 : Forgejo 15.0.11 sur sc-stockage, en lecture seule pour Forgejo. Aucun secret ici :
; ils sont générés dans la VM (forgejo generate secret) à la première installation, dans /etc/forgejo/secrets.
APP_NAME = Forgejo (PoC supply-chain)
RUN_MODE = prod
RUN_USER = forgejo
WORK_PATH = /var/lib/forgejo

[server]
PROTOCOL = https
HTTP_ADDR = 192.168.161.13
HTTP_PORT = 3000
DOMAIN = sc-stockage.poc.test
ROOT_URL = https://sc-stockage.poc.test:3000/
CERT_FILE = /etc/forgejo/tls/forgejo.crt
KEY_FILE = /etc/forgejo/tls/forgejo.key
APP_DATA_PATH = /var/lib/forgejo/data
DISABLE_SSH = true
OFFLINE_MODE = true
LFS_START_SERVER = false

[database]
DB_TYPE = sqlite3
PATH = /var/lib/forgejo/data/forgejo.db

[repository]
ROOT = /var/lib/forgejo/data/repos
DEFAULT_BRANCH = main

[security]
INSTALL_LOCK = true
SECRET_KEY_URI = file:/etc/forgejo/secrets/secret_key
INTERNAL_TOKEN_URI = file:/etc/forgejo/secrets/internal_token

[oauth2]
ENABLED = false
JWT_SECRET_URI = file:/etc/forgejo/secrets/jwt_secret

[service]
DISABLE_REGISTRATION = true

[session]
COOKIE_SECURE = true

; Webhooks vers le réseau des nœuds seulement (EventListener de Triggers, J4).
[webhook]
ALLOWED_HOST_LIST = 192.168.161.0/24

[actions]
ENABLED = false

[packages]
ENABLED = false

[mailer]
ENABLED = false

[cron.update_checker]
ENABLED = false

[log]
MODE = console
LEVEL = Info
