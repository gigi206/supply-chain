# Brique 08 : journal d'audit de l'API (trace du test négatif 3, modification d'un status).
# Lectures exclues ; toute écriture journalisée avec son code de réponse (refus compris).
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # J8 : lectures de Secrets des contrôleurs de Pipelines et de Chains journalisées (bornées à builds par leurs droits ;
  # mesure : preuves.sh controleurs). Avant la règle qui exclut les lectures.
  - level: Metadata
    users:
      - system:serviceaccount:tekton-pipelines:tekton-pipelines-controller
      - system:serviceaccount:tekton-chains:tekton-chains-controller
    verbs: ["get", "list", "watch"]
    resources:
      - group: ""
        resources: ["secrets"]
  - level: None
    verbs: ["get", "list", "watch"]
  - level: None
    resources:
      - group: "coordination.k8s.io"
        resources: ["leases"]
  - level: Metadata
