# Brique 08, J7 : fichier d'appoint du server k3s pour le réseau Cilium (RESEAU=cilium, option 1b accordée par le propriétaire
# le 30/10/2026) : ni flannel ni contrôleur de NetworkPolicy intégré (kube-router), Cilium les remplace (guide Cilium pour k3s,
# documentation de k3s). Installé dans /etc/rancher/k3s/config.yaml.d/ par k3s.sh. Contrôleur Helm de k3s désactivé (option (b)
# du propriétaire du 01/11/2026) : il liait à cluster-admin un compte kube-system:helm-<chart> par HelmChart ; Cilium est installé
# depuis l'hôte (cilium.sh installer).
flannel-backend: none
disable-network-policy: true
disable-helm-controller: true
