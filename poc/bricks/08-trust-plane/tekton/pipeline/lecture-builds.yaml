# Brique 08, J8 (décision du propriétaire du 01/11/2026) : droits de locataire du contrôleur de Pipelines (pods, PVC,
# StatefulSets, lecture des Secrets, ConfigMaps, comptes de service et LimitRanges) dans builds seulement. La liaison de
# tout le cluster du release.yaml est retirée (tenant-access-supprime.yaml) ; le ClusterRole amont est conservé tel quel.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-pipelines-controller-tenant-access
  namespace: builds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-pipelines-controller-tenant-access
subjects:
- kind: ServiceAccount
  name: tekton-pipelines-controller
  namespace: tekton-pipelines
