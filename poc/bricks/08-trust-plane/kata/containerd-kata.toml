# Brique 08, J7 : runtime Kata (shim Rust, configuration qemu-runtime-rs) déclaré à containerd 2.x de k3s v1.35.9 par
# un fichier d'appoint : le config.toml généré par k3s importe config-v3.toml.d/*.toml. Installé par kata.sh installer.
# Mêmes clés que kata-deploy 4.3.1 (runtime/containerd.rs), sauf pod_annotations : vide, aucune annotation d'un pod n'est
# transmise au shim (enable_annotations de la configuration ouvrirait kernel_params, default_vcpus et default_memory).
version = 3

[plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.kata]
  runtime_type = "io.containerd.kata.v2"
  runtime_path = "/opt/kata/runtime-rs/bin/containerd-shim-kata-v2"
  privileged_without_host_devices = true
  pod_annotations = []
  container_annotations = ["io.kubernetes.container.terminationMessage*"]

[plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.kata.options]
  ConfigPath = "/opt/kata/share/defaults/kata-containers/runtime-rs/configuration-qemu-runtime-rs.toml"
