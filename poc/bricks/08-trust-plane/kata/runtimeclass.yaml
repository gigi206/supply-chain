# Brique 08, J7 : RuntimeClass kata (nom reconnu par la règle pods-isolation). Placement réservé à la zone build : label et
# taint de sc-build (relus dans le cluster le 30/10/2026). Surcoût du chart kata-deploy 4.3.1 pour qemu-runtime-rs.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
overhead:
  podFixed:
    memory: 320Mi
    cpu: 250m
scheduling:
  nodeSelector:
    zone: build
  tolerations:
  - key: zone
    operator: Equal
    value: build
    effect: NoSchedule
