# Brique 03, F2 (D1 a, D2 révisée deux fois, D4 a ; décisions du propriétaire du 03/11/2026) : prefetch Hermeto des modules Go
# d'un commit de Forgejo, dans la plateforme. Pod runc conforme à Pod Security restricted, sans aucun secret ; sa seule sortie
# est celle de la CiliumNetworkPolicy prefetch-sortie (politique/prefetch-sortie.yaml : DNS, adresses publiques en 443, Forgejo),
# qui sélectionne les pods de cette tâche. Proxy Go imposé : proxy.golang.org seul, sans repli direct vers les forges. Hermeto lance aussi un git fetch des tags vers
# l'origine (mesuré en F1) : ici Forgejo. La fermeture est écrite dans le workspace sortie, que publier-fermeture pousse.
# Image : outils de prefetch construits par la plateforme (Dockerfile.prefetch de la brique 03). Signée une fois, versionnée
# (prefetch-gomod.signee.yaml), digest dans la liste revue : prefetch.sh taches (brique 03). @PREFETCH@ : idem.
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: prefetch-gomod
spec:
  params:
  - name: depot
    type: string
  - name: commit
    type: string
  workspaces:
  - name: sortie
  results:
  - name: CHAINS-GIT_URL
    type: string
  - name: CHAINS-GIT_COMMIT
    type: string
  volumes:
  - name: ca-poc
    configMap:
      name: ca-poc
  - name: tmp
    emptyDir: {}
  stepTemplate:
    securityContext:
      runAsUser: 65532
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    volumeMounts:
    - name: ca-poc
      mountPath: /etc/ca-poc
      readOnly: true
    - name: tmp
      mountPath: /tmp
  steps:
  - name: prefetch
    image: @PREFETCH@
    env:
    - name: DEPOT
      value: $(params.depot)
    - name: COMMIT
      value: $(params.commit)
    - name: HERMETO_GOMOD__PROXY_URL
      value: https://proxy.golang.org
    script: |
      #!/bin/sh
      set -eu
      case $COMMIT in *[!0-9a-f]*) echo "commit invalide : $COMMIT" >&2; exit 1 ;; esac
      [ ${#COMMIT} = 40 ] || { echo "commit invalide : $COMMIT" >&2; exit 1; }
      case $DEPOT in https://sc-stockage.poc.test:3000/*.git) ;; *) echo "dépôt hors de Forgejo : $DEPOT" >&2; exit 1 ;; esac
      f=$(workspaces.sortie.path)/fermeture
      [ ! -e "$f" ] || { echo "workspace déjà rempli : $f" >&2; exit 1; }
      export HOME=/tmp GIT_CONFIG_NOSYSTEM=1 GIT_SSL_CAINFO=/etc/ca-poc/ca.crt GIT_TERMINAL_PROMPT=0
      git clone --quiet --no-checkout "$DEPOT" /tmp/depot
      git -C /tmp/depot checkout --quiet --detach "$COMMIT"
      [ "$(git -C /tmp/depot rev-parse HEAD)" = "$COMMIT" ] || { echo "HEAD différent du commit demandé" >&2; exit 1; }
      echo "$(hermeto --version | head -1) ; $(go version) ; $(git --version) ; commit $COMMIT"
      hermeto fetch-deps --source /tmp/depot --output "$f" '{"type": "gomod"}'
      echo "fermeture : $(find "$f/deps" -type f | wc -l) fichiers, $(du -sk "$f/deps" | cut -f1) Kio"
      printf '%s' "$DEPOT" > $(results.CHAINS-GIT_URL.path)
      printf '%s' "$COMMIT" > $(results.CHAINS-GIT_COMMIT.path)
