# Brique 08, J7 : préparation des entrées de construire-image (option 3 du contrôle de sortie, choix du propriétaire du
# 30/10/2026). Pod runc conforme à Pod Security restricted : c'est la seule tâche de la construction qui joint le réseau
# (Forgejo et Zot). Les entrées sont écrites dans le workspace sortie, que construire-image lit sans aucune sortie réseau :
#   - commit de Forgejo (git vérifie chaque objet par son empreinte), arbre exporté par git archive ;
#   - fermeture Hermeto et web/dist tirés de Zot par digest (oras vérifie le manifeste puis chaque couche) ;
#   - image de build copiée de Zot par digest en layout OCI (oras cp --to-oci-layout), passée à BuildKit par oci-layout://
#     (mesuré : buildkit.sh sans_reseau) ;
#   - toutes déclarées à Chains (CHAINS-GIT_URL et CHAINS-GIT_COMMIT, *ARTIFACT_INPUTS), qui les inscrit dans
#     resolvedDependencies.
# Pod runc : la ConfigMap ca-poc est montée par les deux étapes (la perte d'une ConfigMap partagée, construction.sh constat_cm,
# est un constat sous Kata). En v1beta1 et signée par tkn comme les tâches de J6 ; signée une fois, versionnée
# (preparer-entrees.signee.yaml), digest dans la liste revue (politique/porte/taches.yml) : construction.sh taches.
# @BUILDKIT@, @OUTILS@ : construction.sh taches.
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: preparer-entrees
spec:
  params:
  - name: depot
    type: string
  - name: commit
    type: string
  - name: fermeture
    type: string
  - name: web-dist
    type: string
  - name: builder
    type: string
  workspaces:
  - name: sortie
  results:
  - name: CHAINS-GIT_URL
    type: string
  - name: CHAINS-GIT_COMMIT
    type: string
  - name: FERMETURE_ARTIFACT_INPUTS
    type: object
    properties:
      uri:
        type: string
      digest:
        type: string
  - name: WEB_DIST_ARTIFACT_INPUTS
    type: object
    properties:
      uri:
        type: string
      digest:
        type: string
  - name: BUILDER_ARTIFACT_INPUTS
    type: object
    properties:
      uri:
        type: string
      digest:
        type: string
  volumes:
  - name: ca-poc
    configMap:
      name: ca-poc
  stepTemplate:
    securityContext:
      runAsUser: 65532
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    volumeMounts:
    - name: ca-poc
      mountPath: /etc/ca-poc
      readOnly: true
  steps:
  - name: sources
    image: @BUILDKIT@
    env:
    - name: DEPOT
      value: $(params.depot)
    - name: COMMIT
      value: $(params.commit)
    script: |
      #!/bin/sh
      set -eu
      case $COMMIT in *[!0-9a-f]*) echo "commit invalide : $COMMIT" >&2; exit 1 ;; esac
      [ ${#COMMIT} = 40 ] || { echo "commit invalide : $COMMIT" >&2; exit 1; }
      case $DEPOT in https://sc-stockage.poc.test:3000/*.git) ;; *) echo "dépôt hors de Forgejo : $DEPOT" >&2; exit 1 ;; esac
      e=$(workspaces.sortie.path)/entrees
      [ ! -e "$e" ] || { echo "workspace déjà rempli : $e" >&2; exit 1; }
      export HOME=/tmp GIT_CONFIG_NOSYSTEM=1 GIT_SSL_CAINFO=/etc/ca-poc/ca.crt GIT_TERMINAL_PROMPT=0
      git clone --quiet --no-checkout "$DEPOT" /tmp/depot
      git -C /tmp/depot checkout --quiet --detach "$COMMIT"
      [ "$(git -C /tmp/depot rev-parse HEAD)" = "$COMMIT" ] || { echo "HEAD différent du commit demandé" >&2; exit 1; }
      echo "$(git --version) ; commit $COMMIT, arbre $(git -C /tmp/depot rev-parse 'HEAD^{tree}')"
      mkdir -p "$e/src"
      git -C /tmp/depot archive --format=tar HEAD | tar -xf - -C "$e/src"
      printf '%s' "$DEPOT" > $(results.CHAINS-GIT_URL.path)
      printf '%s' "$COMMIT" > $(results.CHAINS-GIT_COMMIT.path)
  - name: entrees
    image: @OUTILS@
    env:
    - name: FERMETURE
      value: $(params.fermeture)
    - name: WEB_DIST
      value: $(params.web-dist)
    - name: BUILDER
      value: $(params.builder)
    script: |
      #!/busybox/sh
      set -eu
      for r in "$FERMETURE" "$WEB_DIST" "$BUILDER"; do
        case $r in sc-stockage.poc.test:5000/*@sha256:*) ;; *) echo "référence hors de Zot ou sans digest : $r" >&2; exit 1 ;; esac
      done
      export HOME=/tmp
      e=$(workspaces.sortie.path)/entrees
      oras pull --no-tty --ca-file /etc/ca-poc/ca.crt -o "$e/deps" "$FERMETURE" > /dev/null
      oras pull --no-tty --ca-file /etc/ca-poc/ca.crt -o "$e/src/web/dist" "$WEB_DIST" > /dev/null
      oras cp --no-tty --from-ca-file /etc/ca-poc/ca.crt "$BUILDER" --to-oci-layout "$e/builder:builder" > /dev/null
      i=$(sed -n 's/.*"digest": *"\(sha256:[0-9a-f]\{64\}\)".*/\1/p' "$e/builder/index.json")
      [ "$i" = "${BUILDER#*@}" ] || { echo "layout de l'image de build : $i, attendu ${BUILDER#*@}" >&2; exit 1; }
      echo "fermeture : $(find "$e/deps" -type f | wc -l) fichiers ; web/dist : $(find "$e/src/web/dist" -type f | wc -l) fichiers ; image de build en layout OCI : $i"
      printf '{"uri":"oci://%s","digest":"%s"}' "${FERMETURE%@*}" "${FERMETURE#*@}" > $(results.FERMETURE_ARTIFACT_INPUTS.path)
      printf '{"uri":"oci://%s","digest":"%s"}' "${WEB_DIST%@*}" "${WEB_DIST#*@}" > $(results.WEB_DIST_ARTIFACT_INPUTS.path)
      printf '{"uri":"oci://%s","digest":"%s"}' "${BUILDER%@*}" "${BUILDER#*@}" > $(results.BUILDER_ARTIFACT_INPUTS.path)
