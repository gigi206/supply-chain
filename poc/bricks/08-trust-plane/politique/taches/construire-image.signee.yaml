apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  annotations:
    tekton.dev/signature: MEYCIQD09aJqghPDssaEQmXMifNguQ8Y+6xVQjTCznQZ5LxzcgIhAM3bSntJ7whd2BJrhr1cimZ/7AcoO9l9IZe0FoO5/zvj
  name: construire-image
spec:
  results:
  - name: DIGEST_CONSTRUIT
    type: string
  steps:
  - image: sc-stockage.poc.test:5000/amont/moby/buildkit@sha256:ace6811c21334fa502644b9711e0ea48e8539c5c2a843c2325dfb7b987ab260b
    name: construire
    resources:
      limits:
        cpu: "2"
        memory: 6Gi
      requests:
        cpu: "2"
        memory: 6Gi
    script: |
      #!/bin/sh
      set -eu
      e=$(workspaces.sortie.path)/entrees
      mkdir -p /tmp/run /tmp/df
      i=$(sed -n 's/.*"digest": *"\(sha256:[0-9a-f]\{64\}\)".*/\1/p' "$e/builder/index.json")
      [ "$i" = sha256:d50ae57551c381b591540643fdfee12dd251ae16675c3c69fde221f8e9c28b67 ] || { echo "layout de l'image de build : $i" >&2; exit 1; }
      n=0
      for f in "$e"/builder/blobs/sha256/*; do
        [ "$(sha256sum < "$f" | cut -c1-64)" = "${f##*/}" ] || { echo "blob altéré : ${f##*/}" >&2; exit 1; }
        n=$((n + 1))
      done
      cat > /tmp/df/Dockerfile <<'FIN'
      # sample-app : binaire compilé sans réseau dans l'image de build (contexte nommé
      # « builder », épinglé par digest), fermeture Hermeto montée en lecture seule
      # (contexte nommé « deps »), image finale minimale.
      FROM builder AS build
      WORKDIR /src
      COPY . .
      RUN --network=none --mount=type=bind,from=deps,target=/deps \
          GOPROXY=file:///deps/deps/gomod/pkg/mod/cache/download GOMODCACHE=/tmp/mod GOCACHE=/tmp/cache \
          go build -trimpath -buildvcs=false -ldflags "-s -w -buildid= -X main.Version=1.0.0" -o /out/sample-app .

      FROM scratch
      COPY --from=build /out/sample-app /sample-app
      USER 65532:65532
      ENTRYPOINT ["/sample-app"]
      FIN
      [ "$(sha256sum < /tmp/df/Dockerfile | cut -c1-64)" = d56985c19fe26f361b824ac7de71b88590310356fcbba0bc4842323c200b0619 ] || { echo "Dockerfile différent de la brique 04" >&2; exit 1; }
      echo "invité : $(nproc) vCPU, $(awk '/MemTotal/ {print $2}' /proc/meminfo) kB ; racine de BuildKit : $(awk '$2 == "/bk" {print $3}' /proc/mounts) ; image de build $i, $n blobs conformes"
      buildkitd --oci-worker-snapshotter=native --addr unix:///tmp/run/bk.sock --root /bk > /tmp/bkd.log 2>&1 &
      k=$!
      for _ in $(seq 30); do buildctl --addr unix:///tmp/run/bk.sock debug workers > /dev/null 2>&1 && break; sleep 1; done
      t=$(date +%s)
      buildctl --addr unix:///tmp/run/bk.sock build --frontend dockerfile.v0 --no-cache --opt build-arg:SOURCE_DATE_EPOCH=0 \
        --local context="$e/src" --local dockerfile=/tmp/df --opt filename=Dockerfile \
        --oci-layout magasin="$e/builder" --opt context:builder=oci-layout://magasin@sha256:d50ae57551c381b591540643fdfee12dd251ae16675c3c69fde221f8e9c28b67 \
        --local deps="$e/deps" --opt context:deps=local:deps \
        --output type=oci,dest=$(workspaces.sortie.path)/image.tar,rewrite-timestamp=true
      d=$(tar -xOf $(workspaces.sortie.path)/image.tar index.json | sed -n 's/.*"digest": *"\(sha256:[0-9a-f]\{64\}\)".*/\1/p')
      echo "construction en $(($(date +%s) - t)) s : $d ; tmpfs de BuildKit $(du -sm /bk | cut -f1) Mo"
      kill $k 2> /dev/null || true; wait $k 2> /dev/null || true
      printf '%s' "$d" > $(results.DIGEST_CONSTRUIT.path)
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsNonRoot: false
      runAsUser: 0
    volumeMounts:
    - mountPath: /bk
      name: buildkit
  volumes:
  - emptyDir:
      medium: Memory
      sizeLimit: 4Gi
    name: buildkit
  workspaces:
  - name: sortie
