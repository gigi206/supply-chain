# Brique 08, J6 : tâche d'essai de Trusted Resources (politique.sh taches), signée par tkn avec la clé des tâches de la
# plateforme, publiée en bundle Tekton dans Zot (tekton/tasks/essai-confiance) et tirée par le résolveur bundles.
# En v1beta1 (décision du propriétaire du 29/10/2026) : tkn v0.46.2 décode toute tâche en v1beta1 avant de la signer
# (tektoncd/cli#2894) ; une tâche v1 signée porte alors resources: {} et Pipelines v1.15.5 la rejette. Le contrôleur
# vérifie la v1beta1 telle que signée, puis la convertit en v1.
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: essai-confiance
spec:
  results:
  - name: MESSAGE
    type: string
  steps:
  - name: dire
    image: @BUSYBOX@
    script: |
      #!/bin/sh
      printf '%s' 'tâche signée par la plateforme' > $(results.MESSAGE.path)
