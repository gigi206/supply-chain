# Brique 03, F2 (D3 révisée, décision du propriétaire du 03/11/2026) : publication de la fermeture produite par prefetch-gomod,
# comme closure.sh de la brique 03 : un fichier par couche, fichiers triés, date fixe, bom.json hors des couches (attaché en
# referrer). Le manifeste est d'abord écrit dans un layout OCI local, puis copié par digest : le compte Zot poc-fermetures (secret
# zot-fermetures de builds, monté par cette seule tâche signée) ne peut que créer par digest dans builds/fermetures/** (condition
# CEL de stockage/zot.json), ni tag, ni mise à jour, ni suppression. Pod runc conforme à restricted. Seule cette tâche émet
# IMAGE_URL et IMAGE_DIGEST : Chains signe la fermeture une fois poussée et y écrit .sig et .att (compte poc-build).
# Signée une fois, versionnée (publier-fermeture.signee.yaml), digest dans la liste revue : prefetch.sh taches. @OUTILS@ : idem.
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: publier-fermeture
spec:
  params:
  - name: depot
    type: string
  workspaces:
  - name: sortie
    readOnly: true
  results:
  - name: IMAGE_URL
    type: string
  - name: IMAGE_DIGEST
    type: string
  volumes:
  - name: ca-poc
    configMap:
      name: ca-poc
  - name: zot
    secret:
      secretName: zot-fermetures
  - name: layout
    emptyDir: {}
  stepTemplate:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
  steps:
  - name: publier
    image: @OUTILS@
    env:
    - name: DEPOT
      value: $(params.depot)
    volumeMounts:
    - name: ca-poc
      mountPath: /etc/ca-poc
      readOnly: true
    - name: zot
      mountPath: /etc/zot
      readOnly: true
    - name: layout
      mountPath: /layout
    script: |
      #!/busybox/sh
      set -eu
      case $DEPOT in sc-stockage.poc.test:5000/builds/fermetures/*) ;; *) echo "dépôt hors de builds/fermetures/ : $DEPOT" >&2; exit 1 ;; esac
      case $DEPOT in *@*|*:*:*) echo "dépôt avec tag ou digest : $DEPOT" >&2; exit 1 ;; esac
      export HOME=/tmp
      f=$(workspaces.sortie.path)/fermeture
      cd "$f"
      set --
      for p in $(find . -type f ! -name bom.json | sed 's#^\./##' | LC_ALL=C sort); do
        set -- "$@" "$p:application/vnd.supply-chain.deps-closure.file.v1"
      done
      d=$(oras push --no-tty --oci-layout --format go-template='{{.digest}}' --artifact-type application/vnd.supply-chain.deps-closure.v1 \
        --annotation org.opencontainers.image.created=1970-01-01T00:00:00Z /layout/f:fermeture "$@")
      oras cp --no-tty --from-oci-layout "/layout/f@$d" "$DEPOT@$d" --to-ca-file /etc/ca-poc/ca.crt --to-registry-config /etc/zot/config.json > /dev/null
      lu=$(oras manifest fetch --descriptor --ca-file /etc/ca-poc/ca.crt "$DEPOT@$d" | sed -n 's/.*"digest": *"\(sha256:[0-9a-f]\{64\}\)".*/\1/p')
      [ "$lu" = "$d" ] || { echo "relu dans Zot : $lu" >&2; exit 1; }
      oras attach --no-tty --ca-file /etc/ca-poc/ca.crt --registry-config /etc/zot/config.json --artifact-type application/vnd.cyclonedx+json \
        --annotation org.opencontainers.image.created=1970-01-01T00:00:00Z "$DEPOT@$d" bom.json:application/vnd.cyclonedx+json > /dev/null
      echo "publiée : $DEPOT@$d ($# couches, relue en lecture anonyme ; SBOM en referrer)"
      printf '%s' "$DEPOT" > $(results.IMAGE_URL.path)
      printf '%s' "$d" > $(results.IMAGE_DIGEST.path)
