# Brique 08, J6 : jugement d'une image par la porte (politique.sh porte). @NOM@, @IMAGE@ (référence par digest, nom
# vu des pods), @PORTE@ (image de la porte, épinglée par digest), @POLITIQUE@ (fichier de politique de la ConfigMap), @CM@ (ConfigMap : porte, ou porte-temoin de preuves.sh reglec).
# J8 (test 8) : ec en conteneur d'initialisation (--strict=false : il rend son verdict, JSON sur la sortie standard et dans
# /partage, même en refus ; une erreur de ec fait échouer le pod), puis le contrôle 9 (politique/porte/horodatage.sh) sur
# l'image d'outils @OUTILS@ (cosign v3.1.4), avec les bundles de @BUNDLES@. Verdict de la porte : succès de ec et
# horodatage complet (code de sortie du conteneur horodatage).
# Contrôle 6 (demandé par la brique 10, choix du propriétaire du 03/11/2026) : conteneur vsa (politique/porte/vsa.sh), même image
# d'outils, en parallèle de horodatage ; VSA de replay lue dans builds/vsa/<nom>, clé du domaine de replay (vsa.pub). Verdict de
# la porte : succès de ec, horodatage complet et VSA retenue (le Job ne réussit que si les deux conteneurs réussissent).
apiVersion: batch/v1
kind: Job
metadata:
  name: "@NOM@"
  namespace: porte
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: porte
    spec:
      serviceAccountName: porte
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      nodeSelector:
        zone: confiance
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: porte
        image: "@PORTE@"
        args:
        - validate
        - image
        - --image
        - "@IMAGE@"
        - --public-key
        - /etc/porte/chains.pub
        - --policy
        - /etc/porte/@POLITIQUE@
        - --ignore-rekor
        - --info
        - --show-successes
        - --output
        - json
        - --output
        - json=/partage/ec.json
        - --strict=false
        env:
        - name: SSL_CERT_FILE
          value: /etc/porte/ca-poc.crt
        - name: HOME
          value: /tmp
        - name: TMPDIR
          value: /tmp
        resources:
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: porte
          mountPath: /etc/porte
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: partage
          mountPath: /partage
      containers:
      - name: horodatage
        image: "@OUTILS@"
        command: [sh, /etc/porte/horodatage.sh]
        env:
        - name: IMAGE
          value: @IMAGE@
        - name: BUNDLES
          value: "@BUNDLES@"
        - name: HOME
          value: /tmp
        - name: TMPDIR
          value: /tmp
        resources:
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: porte
          mountPath: /etc/porte
          readOnly: true
        - name: partage
          mountPath: /partage
          readOnly: true
        - name: tmp
          mountPath: /tmp
      - name: vsa
        image: "@OUTILS@"
        command: [sh, /etc/porte/vsa.sh]
        env:
        - name: IMAGE
          value: @IMAGE@
        - name: HOME
          value: /tmp
        - name: TMPDIR
          value: /tmp
        resources:
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: porte
          mountPath: /etc/porte
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: porte
        configMap:
          name: "@CM@"
          items:
          - key: policy.yaml
            path: policy.yaml
          - key: policy-trusted-task.yaml
            path: policy-trusted-task.yaml
          - key: porte.rego
            path: regles/porte.rego
          - key: taches.yml
            path: donnees/taches.yml
          - key: chains.pub
            path: chains.pub
          - key: ca-poc.crt
            path: ca-poc.crt
          - key: horodatage.sh
            path: horodatage.sh
          - key: tsa-racine-confiance.json
            path: tsa-racine-confiance.json
          - key: vsa.sh
            path: vsa.sh
          - key: vsa.pub
            path: vsa.pub
      - name: partage
        emptyDir:
          sizeLimit: 16Mi
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
