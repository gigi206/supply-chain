# Brique 06, S4a (décision du propriétaire du 10/11/2026, 22:52:55 UTC : recommandation 2 révisée) : téléchargement vérifié de
# paquets Debian depuis l'instantané de snapshot.debian.org, en miroir partiel dans le workspace. Pod runc conforme à Pod Security
# restricted (UID 65532), sans aucun secret ; sa seule sortie est celle de la CiliumNetworkPolicy prefetch-deb-sortie (08c :
# DNS, adresses publiques en 80), qui sélectionne les pods de cette tâche par tekton.dev/task. Aucune lecture de Zot ni de Forgejo.
# Image : l'amorce debian:trixie-20261104-slim par digest (D4 a) ; son apt-helper télécharge avec un hash attendu (pkgAcqFile).
# Chaîne d'intégrité : sha256 de l'InRelease fixé par la pipeline signée (signataires vérifiés sur l'hôte en S1), puis sha256 des
# index lus dans l'InRelease, puis sha256 et taille de chaque paquet selon la liste fixée par la pipeline (rapprochée de Packages
# sur l'hôte : builder/paquets.txt). Acquire-By-Hash: yes dans l'InRelease : chaque index est aussi posé sous by-hash/SHA256/.
# S4a : liste en paramètre. S4b : la liste viendra du verrou par le workspace (prévu, non écrit).
# @AMORCE@ : s4a.sh taches. Signée une fois, versionnée (prefetch-deb.signee.yaml), digest dans la liste revue.
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: prefetch-deb
spec:
  params:
  - name: instantane
    type: string
  - name: inrelease
    type: string
  - name: liste
    type: string
  workspaces:
  - name: sortie
  results:
  - name: INSTANTANE_ARTIFACT_INPUTS
    type: object
    properties:
      uri:
        type: string
      digest:
        type: string
  volumes:
  - name: tmp
    emptyDir: {}
  stepTemplate:
    securityContext:
      runAsUser: 65532
      runAsGroup: 65532
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  steps:
  - name: prefetch
    image: @AMORCE@
    env:
    - name: INSTANTANE
      value: $(params.instantane)
    - name: INRELEASE
      value: $(params.inrelease)
    - name: LISTE
      value: $(params.liste)
    - name: HOME
      value: /tmp
    script: |
      #!/bin/sh
      set -eu
      export LC_ALL=C
      case $INSTANTANE in http://snapshot.debian.org/archive/debian/[0-9]*T[0-9]*Z) ;; *) echo "instantané invalide : $INSTANTANE" >&2; exit 1 ;; esac
      case $INRELEASE in *[!0-9a-f]*) echo "sha256 de l'InRelease invalide" >&2; exit 1 ;; esac
      [ ${#INRELEASE} = 64 ] || { echo "sha256 de l'InRelease invalide" >&2; exit 1; }
      m=$(workspaces.sortie.path)/miroir
      [ ! -e "$m" ] || { echo "workspace déjà rempli : $m" >&2; exit 1; }
      h=/usr/lib/apt/apt-helper
      [ -x "$h" ] || { echo "apt-helper absent de l'image" >&2; exit 1; }
      tele() { # chemin-relatif sha256 taille : téléchargé par apt-helper avec son hash, puis revérifié
        mkdir -p "$m/${1%/*}"
        "$h" -o Debug::NoLocking=1 download-file "$INSTANTANE/$1" "$m/$1" "SHA256:$2" > /tmp/dl.log 2>&1 \
          || { tail -n 5 /tmp/dl.log >&2; echo "téléchargement refusé : $1" >&2; exit 1; }
        [ "$(sha256sum < "$m/$1" | cut -c1-64)" = "$2" ] || { echo "sha256 différent : $1" >&2; exit 1; }
        [ -z "$3" ] || [ "$(stat -c %s "$m/$1")" = "$3" ] || { echo "taille différente : $1" >&2; exit 1; }
      }
      echo "$(id) ; $(apt-get --version | head -1) ; instantané $INSTANTANE"
      t=$(date +%s)
      tele dists/trixie/InRelease "$INRELEASE" ""
      for f in main/binary-amd64/Packages.xz main/i18n/Translation-en.xz; do
        l=$(awk -v f="$f" '/^SHA256:/ {s = 1; next} /^[^ ]/ {s = 0} s && $3 == f {print $1, $2}' "$m/dists/trixie/InRelease")
        [ -n "$l" ] || { echo "index absent de l'InRelease : $f" >&2; exit 1; }
        tele "dists/trixie/$f" "${l% *}" "${l#* }"
        mkdir -p "$m/dists/trixie/${f%/*}/by-hash/SHA256"
        cp "$m/dists/trixie/$f" "$m/dists/trixie/${f%/*}/by-hash/SHA256/${l% *}"
        echo "index $f : sha256 ${l% *}, ${l#* } octets (InRelease)"
      done
      n=0
      printf '%s\n' "$LISTE" > /tmp/liste
      while read -r s z p; do
        [ -n "$s" ] || continue
        case $p in pool/main/*.deb) ;; *) echo "chemin hors du pool : $p" >&2; exit 1 ;; esac
        case $p in *..*) echo "chemin invalide : $p" >&2; exit 1 ;; esac
        tele "$p" "$s" "$z"
        n=$((n + 1))
      done < /tmp/liste
      echo "miroir : $n paquets, $(find "$m/pool" -type f -name '*.deb' -printf '%s\n' | awk '{s += $1} END {print s}') octets, en $(($(date +%s) - t)) s"
      printf '{"uri":"%s/dists/trixie/InRelease","digest":"sha256:%s"}' "$INSTANTANE" "$INRELEASE" > $(results.INSTANTANE_ARTIFACT_INPUTS.path)
