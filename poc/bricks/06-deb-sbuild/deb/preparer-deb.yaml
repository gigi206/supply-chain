# Brique 06, S4d1 (décisions du propriétaire du 11/11/2026, 17:54:35 UTC : « Oui, retiens-les ») : préparation des entrées de
# construire-deb. Pod runc restreint (UID 65532), sans secret ; seule tâche de la construction deb qui joint le réseau (Forgejo et
# Zot : builds-sans-internet de la 08c lui refuse les adresses publiques). Sur le modèle de preparer-entrees (08, J7) :
#   - commit de Forgejo (git vérifie chaque objet par son empreinte), arbre exporté par git archive sous entrees/src ;
#   - fermeture deb, fermeture applicative et artefact de packaging tirés de Zot par digest (oras vérifie le manifeste puis chaque
#     couche), digests fixés par la pipeline signée ;
#   - fermeture deb confrontée au verrou de l'artefact de packaging (S4d, reporté de S4b par l'ADR 0007) : exactement les .deb du
#     verrou (sha256, taille, chemin), aucun autre fichier dans le pool. L'InRelease et les index de la fermeture ne servent pas à
#     la construction (sbuild ne lit que les .deb, par --extra-package) : ils ne sont pas contrôlés ici ;
#   - vendor/ reconstitué par go mod vendor depuis la fermeture applicative, sans réseau (GOPROXY=off), puis go mod verify ;
#     web/node_modules/marked extrait de son archive après contrôle de l'integrity du lockfile ; même arbre que l'archive de
#     sources.sh (contrôle sur l'hôte du 11/11/2026, additif de 17:51 UTC) ;
#   - debian/ et le verrou copiés sous entrees/, debian/rules remis en 0755 (perdu par oras, seul fichier en 100755 dans git) ;
#   - entrées déclarées à Chains (CHAINS-GIT_URL et CHAINS-GIT_COMMIT, un *_ARTIFACT_INPUTS par artefact, noms distincts), qui
#     les inscrit dans resolvedDependencies.
# Le .dsc n'est pas assemblé ici (décision du propriétaire du 11/11/2026, 17:54:35 UTC) : seule l'image de build a dpkg-dev.
# Signée une fois, versionnée (preparer-deb.signee.yaml), digest dans la liste revue (politique/porte/taches.yml de la 08).
# @PREFETCH@ (git, go 1.26.10, python3), @OUTILS@ (oras) : s4d.sh.
# Corrigé le 11/11/2026 après le premier PipelineRun (s4d-deb-1, 19:28 UTC : « could not create work tree dir '/tmp/depot':
# Permission denied ») : /tmp de l'image de prefetch appartient à root en 0755 (lu dans sa couche ; 1777 dans l'image d'outils).
# Un emptyDir est monté sur /tmp pour toutes les étapes, comme dans prefetch-gomod.
# Corrigé le 11/11/2026 après le second PipelineRun (19:32 UTC : « cp: can't stat '…/entrees/deps/gomod/pkg/mod' ») : la fermeture
# applicative porte déjà deps/ à sa racine ; elle est tirée sous entrees/sources, et lue sous sources/deps/.
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: preparer-deb
spec:
  params:
  - name: depot
    type: string
  - name: commit
    type: string
  - name: fermeture-deb
    type: string
  - name: fermeture-sources
    type: string
  - name: packaging
    type: string
  workspaces:
  - name: sortie
  results:
  - name: CHAINS-GIT_URL
    type: string
  - name: CHAINS-GIT_COMMIT
    type: string
  - name: FERMETURE_DEB_ARTIFACT_INPUTS
    type: object
    properties:
      uri:
        type: string
      digest:
        type: string
  - name: FERMETURE_SOURCES_ARTIFACT_INPUTS
    type: object
    properties:
      uri:
        type: string
      digest:
        type: string
  - name: PACKAGING_ARTIFACT_INPUTS
    type: object
    properties:
      uri:
        type: string
      digest:
        type: string
  volumes:
  - name: ca-poc
    configMap:
      name: ca-poc
  - name: tmp
    emptyDir: {}
  stepTemplate:
    securityContext:
      runAsUser: 65532
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    volumeMounts:
    - name: ca-poc
      mountPath: /etc/ca-poc
      readOnly: true
    - name: tmp
      mountPath: /tmp
  steps:
  - name: sources
    image: @PREFETCH@
    env:
    - name: DEPOT
      value: $(params.depot)
    - name: COMMIT
      value: $(params.commit)
    script: |
      #!/bin/sh
      set -eu
      case $COMMIT in *[!0-9a-f]*) echo "commit invalide : $COMMIT" >&2; exit 1 ;; esac
      [ ${#COMMIT} = 40 ] || { echo "commit invalide : $COMMIT" >&2; exit 1; }
      case $DEPOT in https://sc-stockage.poc.test:3000/*.git) ;; *) echo "dépôt hors de Forgejo : $DEPOT" >&2; exit 1 ;; esac
      e=$(workspaces.sortie.path)/entrees
      [ ! -e "$e" ] || { echo "workspace déjà rempli : $e" >&2; exit 1; }
      export HOME=/tmp GIT_CONFIG_NOSYSTEM=1 GIT_SSL_CAINFO=/etc/ca-poc/ca.crt GIT_TERMINAL_PROMPT=0
      git clone --quiet --no-checkout "$DEPOT" /tmp/depot
      git -C /tmp/depot checkout --quiet --detach "$COMMIT"
      [ "$(git -C /tmp/depot rev-parse HEAD)" = "$COMMIT" ] || { echo "HEAD différent du commit demandé" >&2; exit 1; }
      echo "$(git --version) ; commit $COMMIT, arbre $(git -C /tmp/depot rev-parse 'HEAD^{tree}')"
      mkdir -p "$e/src"
      git -C /tmp/depot archive --format=tar HEAD | tar -xf - -C "$e/src"
      printf '%s' "$DEPOT" > $(results.CHAINS-GIT_URL.path)
      printf '%s' "$COMMIT" > $(results.CHAINS-GIT_COMMIT.path)
  - name: entrees
    image: @OUTILS@
    env:
    - name: FERMETURE_DEB
      value: $(params.fermeture-deb)
    - name: FERMETURE_SOURCES
      value: $(params.fermeture-sources)
    - name: PACKAGING
      value: $(params.packaging)
    script: |
      #!/busybox/sh
      set -eu
      for r in "$FERMETURE_DEB" "$FERMETURE_SOURCES" "$PACKAGING"; do
        case $r in sc-stockage.poc.test:5000/*@sha256:*) ;; *) echo "référence hors de Zot ou sans digest : $r" >&2; exit 1 ;; esac
      done
      export HOME=/tmp
      e=$(workspaces.sortie.path)/entrees
      oras pull --no-tty --ca-file /etc/ca-poc/ca.crt -o "$e/fermeture" "$FERMETURE_DEB" > /dev/null
      oras pull --no-tty --ca-file /etc/ca-poc/ca.crt -o "$e/sources" "$FERMETURE_SOURCES" > /dev/null
      oras pull --no-tty --ca-file /etc/ca-poc/ca.crt -o "$e/packaging" "$PACKAGING" > /dev/null
      echo "fermeture deb : $(find "$e/fermeture" -type f | wc -l) fichiers ; fermeture applicative : $(find "$e/sources" -type f | wc -l) fichiers ; packaging : $(find "$e/packaging" -type f | wc -l) fichiers"
      # Confrontation de la fermeture deb au verrou (colonnes 4 à 6 : sha256, taille, chemin sous miroir/)
      v=$e/packaging/verrou-deb.txt
      [ -s "$v" ] || { echo "verrou absent de l'artefact de packaging" >&2; exit 1; }
      m=$e/fermeture/miroir
      grep -v '^#' "$v" | grep . > /tmp/verrou
      n=0
      while read -r _ _ _ s z p; do
        case $p in pool/*.deb) ;; *) echo "chemin du verrou non admis : $p" >&2; exit 1 ;; esac
        case $p in *..*) echo "chemin du verrou non admis : $p" >&2; exit 1 ;; esac
        [ -f "$m/$p" ] && [ ! -L "$m/$p" ] || { echo "paquet du verrou absent de la fermeture : $p" >&2; exit 1; }
        [ "$(sha256sum < "$m/$p" | cut -c1-64)" = "$s" ] || { echo "paquet différent du verrou : $p" >&2; exit 1; }
        [ "$(($(wc -c < "$m/$p")))" = "$z" ] || { echo "taille différente du verrou : $p" >&2; exit 1; }
        n=$((n + 1))
      done < /tmp/verrou
      [ "$n" -gt 0 ] || { echo "verrou vide" >&2; exit 1; }
      [ "$(find "$m/pool" -type f | wc -l)" = "$n" ] || { echo "pool : $(find "$m/pool" -type f | wc -l) fichiers, $n dans le verrou" >&2; exit 1; }
      [ -z "$(find "$m/pool" ! -type f ! -type d)" ] || { echo "pool : objet qui n'est ni fichier ni répertoire" >&2; exit 1; }
      echo "fermeture deb confrontée au verrou : $n paquets, sha256, taille et chemin identiques, aucun autre fichier dans le pool"
      printf '{"uri":"oci://%s","digest":"%s"}' "${FERMETURE_DEB%@*}" "${FERMETURE_DEB#*@}" > $(results.FERMETURE_DEB_ARTIFACT_INPUTS.path)
      printf '{"uri":"oci://%s","digest":"%s"}' "${FERMETURE_SOURCES%@*}" "${FERMETURE_SOURCES#*@}" > $(results.FERMETURE_SOURCES_ARTIFACT_INPUTS.path)
      printf '{"uri":"oci://%s","digest":"%s"}' "${PACKAGING%@*}" "${PACKAGING#*@}" > $(results.PACKAGING_ARTIFACT_INPUTS.path)
  - name: assemblage
    image: @PREFETCH@
    script: |
      #!/bin/sh
      set -eu
      e=$(workspaces.sortie.path)/entrees
      export HOME=/tmp GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off GOFLAGS=-mod=mod GOMODCACHE=/tmp/gomod GOCACHE=/tmp/gocache CGO_ENABLED=0
      # vendor/ : cache de modules copié hors du workspace (go y extrait les modules en lecture seule)
      cp -r "$e/sources/deps/gomod/pkg/mod" /tmp/gomod
      (cd "$e/src" && go mod vendor && go mod verify)
      echo "$(go version) : vendor/ reconstitué, $(find "$e/src/vendor" -type f | wc -l) fichiers"
      # marked : integrity du lockfile, puis extraction (premier composant retiré, comme tar --strip-components=1)
      python3 -I - "$e/src/web/package-lock.json" "$e/sources/deps/npm" "$e/src/web/node_modules/marked" <<'FIN'
      import base64, hashlib, json, os, sys, tarfile
      lock, npm, dst = sys.argv[1:]
      p = json.load(open(lock, encoding='utf-8'))['packages']['node_modules/marked']
      a = os.path.join(npm, 'marked-' + p['version'] + '.tgz')
      calc = 'sha512-' + base64.b64encode(hashlib.sha512(open(a, 'rb').read()).digest()).decode()
      if calc != p['integrity']:
          sys.exit(f'integrity de {os.path.basename(a)} différente du lockfile')
      os.makedirs(dst)
      with tarfile.open(a) as t:
          m = []
          for x in t.getmembers():
              n = x.name.split('/', 1)
              if n == ['package', ''] and x.isdir():
                  continue
              if len(n) < 2 or n[0] != 'package' or not n[1]:
                  sys.exit(f'membre inattendu dans {os.path.basename(a)} : {x.name}')
              x.name = n[1]
              m.append(x)
          t.extractall(dst, members=m, filter='data')
      print(f'marked {p["version"]} : integrity conforme au lockfile, {len(m)} membres extraits')
      FIN
      # debian/ et verrou ; rules exécutable (seul fichier en 100755 dans git, mode perdu par oras)
      cp -r "$e/packaging/debian" "$e/debian"
      cp "$e/packaging/verrou-deb.txt" "$e/verrou-deb.txt"
      find "$e/debian" -type f -exec chmod 0644 {} \;
      chmod 0755 "$e/debian/rules"
      rm -rf "$e/sources" "$e/packaging"
      echo "entrées prêtes : src ($(find "$e/src" -type f | wc -l) fichiers), debian ($(find "$e/debian" -type f | wc -l) fichiers), fermeture deb, verrou"
