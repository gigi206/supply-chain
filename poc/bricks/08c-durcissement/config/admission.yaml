# Brique 08c : admission de kube-apiserver, /etc/rancher/rke2/admission.yaml (0600). Pod Security de la 08b, avec l'exemption de la RuntimeClass
# kata, plus EventRateLimit, dans un seul fichier : kube-apiserver ne lit qu'une configuration d'admission. Montage repris du dépôt du propriétaire
# (https://github.com/gigi206/k8s). Seuils de ce dépôt, à relever sur le rejeu : un refus d'événement ne doit toucher aucun contrôle.
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
- name: PodSecurity
  configuration:
    apiVersion: pod-security.admission.config.k8s.io/v1
    kind: PodSecurityConfiguration
    defaults:
      enforce: restricted
      enforce-version: latest
      audit: restricted
      audit-version: latest
      warn: restricted
      warn-version: latest
    exemptions:
      usernames: []
      runtimeClasses: [kata]
      namespaces: [kube-system]
- name: EventRateLimit
  configuration:
    apiVersion: eventratelimit.admission.k8s.io/v1alpha1
    kind: Configuration
    limits:
    - type: Namespace
      qps: 50
      burst: 100
      cacheSize: 2000
    - type: User
      qps: 10
      burst: 50
