# Brique 08c, H6 (mesure, pas décision) : chiffrement WireGuard de Cilium entre nœuds, sans Envoy ni mesh, idée reprise de
# vagrant/scripts/configure_cilium.sh du dépôt du propriétaire (https://github.com/gigi206/k8s). Format du chart 1.20.4 : strictMode y est séparé en
# egress et ingress, l'ancienne forme n'a plus d'effet (rendu à sec du 05/11/2026). Le guide Kata de Cilium signale une limite de MTU avec
# WireGuard : à mesurer sur la construction. allowRemoteNodeIdentities retiré le 06/11/2026 : sans effet ici, il ne joue que si le CIDR strict contient l'adresse du nœud
# (pkg/datapath/linux/config/config.go, v1.20.4). Ne porte pas le pare-feu d'hôte : h6 concatène ce fichier à valeurs-cilium.yaml, jamais seul.
encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true
  strictMode:
    egress:
      enabled: true
      cidr: 10.42.0.0/16
