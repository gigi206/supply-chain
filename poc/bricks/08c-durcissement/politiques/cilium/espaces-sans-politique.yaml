# Brique 08c : refus par défaut des espaces qui n'ont pas de politique. Idée reprise de default-deny-pod-ingress et default-deny-external-egress du
# dépôt du propriétaire (https://github.com/gigi206/k8s), avec une différence voulue : la liste d'espaces est fermée, pas `endpointSelector: {}`.
# Les règles d'autorisation s'additionnent. Une règle ouverte à tous les pods rouvrirait donc la sortie de construire-image, fermée par
# construction-sans-sortie, et le test 6 tomberait. builds, porte, openbao, tsa, horodatage, scan et declencheurs gardent leurs seules politiques.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: espaces-sans-politique
spec:
  description: "Plateforme : entrées de l'API et de l'espace, sorties internes seulement, rien vers l'extérieur"
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values: [tekton-chains, tekton-pipelines, tekton-pipelines-resolvers, kyverno, local-path-storage, observabilite]
  ingress:
    - fromEntities: [kube-apiserver, host, remote-node]
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values: [tekton-chains, tekton-pipelines, tekton-pipelines-resolvers, kyverno, local-path-storage, observabilite]
  egress:
    - toEntities: [kube-apiserver, cluster]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
