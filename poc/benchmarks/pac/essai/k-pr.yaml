apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: k-pr
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
spec:
  params:
  - name: marque
    value: "main"
  pipelineSpec:
    params:
    - name: marque
      type: string
    tasks:
    - name: echo
      params:
      - name: marque
        value: $(params.marque)
      taskSpec:
        params:
        - name: marque
          type: string
        steps:
        - name: echo
          image: @BUSYBOX@
          script: echo "marque=$(params.marque)"
