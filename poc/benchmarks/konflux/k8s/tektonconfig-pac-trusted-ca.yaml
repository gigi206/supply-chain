# Banc A1 : le contrôleur PaC doit faire confiance à la CA de Konflux (bundle trusted-ca)
# pour appeler l'API Forgejo en HTTPS. Même mécanisme que Konflux applique déjà à Chains
# et aux résolveurs (dependencies/tekton-config/tekton-config.yml). Patch « merge » du TektonConfig.
# Constat : l'opérateur Tekton v0.81.1 ne le propage pas vers l'objet OpenShiftPipelinesAsCode
# sur Kubernetes ; pac-trusted-ca.json pose la même option sur cet objet (onboarder.sh).
spec:
  platforms:
    kubernetes:
      pipelinesAsCode:
        options:
          deployments:
            pipelines-as-code-controller:
              spec:
                template:
                  spec:
                    volumes:
                      - name: trusted-ca
                        configMap:
                          name: trusted-ca
                          items:
                            - key: ca-bundle.crt
                              path: ca-bundle.crt
                          optional: true
                    containers:
                      - name: pac-controller
                        volumeMounts:
                          - name: trusted-ca
                            mountPath: /etc/ssl/certs
                            readOnly: true
